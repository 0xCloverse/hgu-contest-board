<title>공모전 보드</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500;600&family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap">
<style>
  :root{
    --bg:#FAFAF9;
    --card:#FFFFFF;
    --ink:#1A1C1B;
    --ink-2:#4E5453;
    --ink-3:#868C8B;
    --rule:#E2E5E3;
    --rule-2:#EFF1EF;
    --accent:#2F6F5E;
    --tae:#2B5CA8;      --tae-bg:#E7EEF8;
    --jian:#A85B22;     --jian-bg:#F8EEE4;
    --both:#1E7A55;     --both-bg:#E2F1EA;
    --skip:#7D8483;     --skip-bg:#ECEEED;
    --warn:#9A3B2F;
    --hot:#B3352A;
    --on-solid:#FFFFFF;
    --dv-doc:#55606E;   --dv-doc-bg:#ECEFF2;
    --dv-media:#6B4A94; --dv-media-bg:#F0EAF7;
    --dv-build:#1F6B57; --dv-build-bg:#E3F0EB;
  }
  @media (prefers-color-scheme:dark){
    :root:not([data-theme="light"]){
      --bg:#111413; --card:#191D1C; --ink:#E9EDEB; --ink-2:#A9B1AF; --ink-3:#7B8382;
      --rule:#2A302E; --rule-2:#222826; --accent:#7FC3AC;
      --tae:#8FB6EC;  --tae-bg:#1A2634;
      --jian:#E0A06A; --jian-bg:#2E2318;
      --both:#77CCA5; --both-bg:#1B3E31;
      --skip:#8B9391; --skip-bg:#242A28;
      --warn:#E89185; --hot:#EE8B80; --on-solid:#111413;
      --dv-doc:#A7B1BD;   --dv-doc-bg:#232A31;
      --dv-media:#C4A3E8; --dv-media-bg:#271E33;
      --dv-build:#7FC9AE; --dv-build-bg:#15291F;
    }
  }
  :root[data-theme="dark"]{
    --bg:#111413; --card:#191D1C; --ink:#E9EDEB; --ink-2:#A9B1AF; --ink-3:#7B8382;
    --rule:#2A302E; --rule-2:#222826; --accent:#7FC3AC;
    --tae:#8FB6EC;  --tae-bg:#1A2634;
    --jian:#E0A06A; --jian-bg:#2E2318;
    --both:#77CCA5; --both-bg:#1B3E31;
    --skip:#8B9391; --skip-bg:#242A28;
    --warn:#E89185; --hot:#EE8B80; --on-solid:#111413;
    --dv-doc:#A7B1BD;   --dv-doc-bg:#232A31;
    --dv-media:#C4A3E8; --dv-media-bg:#271E33;
    --dv-build:#7FC9AE; --dv-build-bg:#15291F;
  }

  *{box-sizing:border-box}
  body{
    background:var(--bg);color:var(--ink);
    font-family:"IBM Plex Sans KR","Apple SD Gothic Neo",system-ui,sans-serif;
    font-size:15px;line-height:1.6;-webkit-font-smoothing:antialiased;
  }
  .wrap{max-width:840px;margin:0 auto;padding:0 20px 90px}
  .mono{font-family:"IBM Plex Mono",monospace;font-variant-numeric:tabular-nums}

  /* ---- header ---- */
  header{padding:44px 0 0}
  h1{font-size:29px;font-weight:700;letter-spacing:-.02em;margin:0}
  .sub{color:var(--ink-3);font-size:13.5px;margin:6px 0 0}
  .statusline{
    display:flex;align-items:center;gap:16px;flex-wrap:wrap;
    margin-top:16px;font-size:12px;color:var(--ink-3);
  }
  .statusline .mono{color:var(--ink-2);font-weight:500}
  .led{display:inline-flex;align-items:center;gap:6px}
  .led i{width:7px;height:7px;border-radius:50%;background:var(--ink-3);display:block}
  .led[data-s="live"] i{background:var(--both)} .led[data-s="live"]{color:var(--both)}
  .led[data-s="off"]  i{background:var(--warn)} .led[data-s="off"]{color:var(--warn)}

  /* ---- tabs ---- */
  .tabs{
    display:flex;gap:24px;margin-top:26px;
    border-bottom:1px solid var(--rule);position:sticky;top:0;background:var(--bg);z-index:20;
  }
  .tabs button{
    background:none;border:none;padding:12px 0;cursor:pointer;
    font:600 15px/1 "IBM Plex Sans KR",sans-serif;color:var(--ink-3);
    border-bottom:2px solid transparent;margin-bottom:-1px;
  }
  .tabs button:hover{color:var(--ink)}
  .tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--ink)}
  .tabs .n{font-family:"IBM Plex Mono",monospace;font-size:12px;color:var(--ink-3);margin-left:6px}

  /* ---- topic section ---- */
  .topic{margin-top:38px}
  .topic-h{
    display:flex;align-items:baseline;gap:10px;
    padding-bottom:8px;border-bottom:1px solid var(--rule);
  }
  .topic-h h2{font-size:15px;font-weight:600;margin:0;letter-spacing:-.01em}
  .topic-h .n{font-family:"IBM Plex Mono",monospace;font-size:12px;color:var(--ink-3)}

  /* ---- competition ---- */
  .c{padding:20px 0;border-bottom:1px solid var(--rule-2);scroll-margin-top:72px}
  /* 선택 후보에서 넘어왔을 때 어디로 왔는지 잠깐 짚어준다 */
  .c.flash{animation:flash 1.8s ease-out}
  @keyframes flash{
    0%,25%{background:var(--both-bg);box-shadow:0 0 0 10px var(--both-bg)}
    100%  {background:transparent;box-shadow:0 0 0 10px transparent}
  }
  @media (prefers-reduced-motion:reduce){
    .c.flash{animation:none;background:var(--both-bg);box-shadow:0 0 0 10px var(--both-bg)}
  }
  /* 선택 후보의 공모전명은 상세로 가는 내부 링크 */
  .pick-row a[data-jump]{cursor:pointer}
  .pick-row a[data-jump]:hover{text-decoration:underline}
  .c-head{display:grid;grid-template-columns:54px 1fr auto;gap:0 14px;align-items:start}
  .c-d{font-family:"IBM Plex Mono",monospace;font-variant-numeric:tabular-nums;
       font-size:16px;font-weight:600;text-align:right;padding-top:1px}
  .c-d.hot{color:var(--hot)}
  .c-d small{display:block;font-size:10.5px;font-weight:500;color:var(--ink-3);margin-top:2px}
  .c-title{font-size:16px;font-weight:600;line-height:1.4;margin:0}
  .c-title a{color:var(--ink);text-decoration:none;border-bottom:1px solid transparent}
  .c-title a:hover{border-bottom-color:var(--ink-3)}
  .c-org{font-size:12.5px;color:var(--ink-3);margin:2px 0 0}

  /* 제출물 칩 — 문서 / 미디어 / 구현 */
  .dv{
    display:inline-flex;align-items:center;gap:6px;margin-top:8px;
    font-size:11.5px;font-weight:600;padding:4px 9px;border-radius:5px;
  }
  .dv i{
    font-family:"IBM Plex Mono",monospace;font-size:9.5px;font-weight:600;
    font-style:normal;opacity:.72;letter-spacing:.04em;
  }
  .dv[data-t="doc"]  {background:var(--dv-doc-bg);  color:var(--dv-doc)}
  .dv[data-t="media"]{background:var(--dv-media-bg);color:var(--dv-media)}
  .dv[data-t="build"]{background:var(--dv-build-bg);color:var(--dv-build)}

  /* ---- pick ---- */
  .pickwrap{position:relative}
  .pickbtn{
    font:500 12.5px/1 "IBM Plex Sans KR",sans-serif;padding:7px 12px;border-radius:6px;
    border:1px solid var(--rule);background:var(--card);color:var(--ink-2);cursor:pointer;white-space:nowrap;
  }
  .pickbtn:hover{border-color:var(--ink-3);color:var(--ink)}
  .pickbtn[data-has="1"]{border-style:solid}
  .pop{
    position:absolute;right:0;top:calc(100% + 6px);z-index:40;
    background:var(--card);border:1px solid var(--rule);border-radius:8px;
    box-shadow:0 6px 20px rgba(0,0,0,.13);padding:5px;min-width:132px;
  }
  .pop button{
    display:flex;align-items:center;gap:9px;width:100%;
    font:500 13.5px/1 "IBM Plex Sans KR",sans-serif;padding:9px 10px;border-radius:5px;
    border:none;background:none;color:var(--ink);cursor:pointer;text-align:left;
  }
  .pop button:hover{background:var(--rule-2)}
  .pop .box{
    width:15px;height:15px;border-radius:4px;border:1.5px solid var(--rule);flex:none;
    display:flex;align-items:center;justify-content:center;font-size:10px;color:var(--on-solid);
  }
  .pop button[aria-pressed="true"][data-p="tae"]  .box{background:var(--tae);border-color:var(--tae)}
  .pop button[aria-pressed="true"][data-p="jian"] .box{background:var(--jian);border-color:var(--jian)}
  .pop button[data-p="skip"]{margin-top:4px;padding-top:11px;border-top:1px solid var(--rule-2);color:var(--ink-2)}
  .pop button[aria-pressed="true"][data-p="skip"]{color:var(--skip)}
  .pop button[aria-pressed="true"][data-p="skip"] .box{background:var(--skip);border-color:var(--skip)}

  /* ---- 취소된 공모전 ---- */
  .c[data-skip="1"]{opacity:.42;transition:opacity .15s}
  .c[data-skip="1"]:hover{opacity:.8}
  .c[data-skip="1"] .c-title a{text-decoration:line-through;text-decoration-color:var(--skip);text-decoration-thickness:1.5px}
  .pickbtn[data-skip="1"]{color:var(--skip);border-color:var(--skip)}

  /* ---- who badges ---- */
  .who{display:flex;gap:5px;margin-top:7px;flex-wrap:wrap}
  .tag{
    font-family:"IBM Plex Mono",monospace;font-size:10.5px;font-weight:600;
    padding:3px 8px;border-radius:4px;letter-spacing:.02em;
  }
  .tag[data-w="tae"] {background:var(--tae-bg); color:var(--tae)}
  .tag[data-w="jian"]{background:var(--jian-bg);color:var(--jian)}
  .tag[data-w="both"]{background:var(--both-bg);color:var(--both)}
  .tag[data-w="skip"]{background:var(--skip-bg);color:var(--skip)}

  /* ---- details ---- */
  .c-body{margin-left:68px;margin-top:12px}
  @media (max-width:600px){ .c-body{margin-left:0} }
  dl{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;margin:0;font-size:13.5px}
  dt{color:var(--ink-3);font-size:11.5px;font-weight:500;white-space:nowrap;padding-top:3px}
  dd{margin:0;color:var(--ink-2)}
  dd b{color:var(--ink);font-weight:600}
  dd.mono{font-weight:500;color:var(--ink)}
  .p-note{font-size:13px;color:var(--ink-2);margin:11px 0 0;padding-left:11px;border-left:2px solid var(--rule)}
  .p-warn{font-size:13px;color:var(--warn);margin:8px 0 0;padding-left:11px;border-left:2px solid var(--warn)}
  .go{
    display:inline-block;margin-top:11px;font-family:"IBM Plex Mono",monospace;
    font-size:12px;color:var(--accent);text-decoration:none;
  }
  .go:hover{text-decoration:underline}

  /* ---- 선택 후보 ---- */
  .person{margin-top:34px}
  .person-h{display:flex;align-items:center;gap:10px;padding-bottom:9px;border-bottom:2px solid}
  .person-h[data-p="tae"] {border-color:var(--tae)}
  .person-h[data-p="jian"]{border-color:var(--jian)}
  .person-h h2{font-size:18px;font-weight:700;margin:0}
  .person-h[data-p="tae"]  h2{color:var(--tae)}
  .person-h[data-p="jian"] h2{color:var(--jian)}
  .person-h .n{font-family:"IBM Plex Mono",monospace;font-size:12.5px;color:var(--ink-3)}
  .sub-topic{margin-top:16px}
  .sub-topic h3{
    font-size:11.5px;font-weight:600;color:var(--ink-3);margin:0 0 4px;
    letter-spacing:.04em;
  }
  .pick-row{
    display:grid;grid-template-columns:54px 1fr auto;gap:0 14px;align-items:center;
    padding:9px 11px;border-radius:6px;margin-left:-11px;
  }
  .pick-row.both{background:var(--both-bg);box-shadow:inset 3px 0 0 var(--both)}
  .pick-row .c-d{font-size:14px}
  .pick-row.both .c-d{color:var(--both)}
  .pick-row a{color:var(--ink);text-decoration:none;font-size:14px;font-weight:500}
  .pick-row.both a{color:var(--both);font-weight:600}
  .pick-row a:hover{text-decoration:underline}
  .pick-row .sub2{display:block;font-size:11.5px;color:var(--ink-3);font-weight:400;margin-top:1px}

  /* 메모 — 라벨 + 본문. 비어 있을 땐 조용하고, 손대면 드러난다 */
  .memo-line{
    grid-column:2/-1;display:flex;align-items:flex-start;gap:9px;margin-top:7px;
  }
  .memo-line.peer{margin-top:2px}
  .memo-tag{
    font-family:"IBM Plex Mono",monospace;font-size:10.5px;font-weight:600;
    letter-spacing:.03em;color:var(--ink-3);flex:none;padding-top:9px;
  }
  .memo-tag[data-w="tae"] {color:var(--tae)}
  .memo-tag[data-w="jian"]{color:var(--jian)}
  textarea.memo{
    /* flex-start로 두지 않으면 컨테이너가 행 높이만큼 늘려버려서
       height:auto 측정값(scrollHeight)이 실제 내용 높이보다 커진다 */
    flex:1;min-width:0;display:block;
    font:400 13px/1.5 "IBM Plex Sans KR",sans-serif;color:var(--ink);
    background:transparent;border:1px solid transparent;border-radius:5px;
    padding:5px 8px;resize:none;overflow:hidden;min-height:28px;
  }
  textarea.memo::placeholder{color:var(--ink-3);opacity:.7}
  textarea.memo:hover{border-color:var(--rule)}
  textarea.memo:focus{outline:none;border-color:var(--accent);background:var(--card)}
  .pick-row.both textarea.memo:focus{background:var(--bg)}
  .memo-text{
    flex:1;min-width:0;padding:5px 8px;
    font-size:13px;line-height:1.5;color:var(--ink-2);
  }
  .empty{color:var(--ink-3);font-size:13.5px;padding:16px 0}
  .legend{
    display:flex;gap:16px;flex-wrap:wrap;margin-top:18px;
    font-size:12px;color:var(--ink-3);
  }
  .legend span{display:inline-flex;align-items:center;gap:6px}
  .legend i{width:11px;height:11px;border-radius:3px;display:block}

  /* ---- past ---- */
  details.past{margin-top:44px;border-top:1px solid var(--rule);padding-top:16px}
  details.past summary{cursor:pointer;font-size:13.5px;font-weight:600;color:var(--ink-2)}
  details.past summary:hover{color:var(--ink)}
  .past-wrap{overflow-x:auto;margin-top:14px}
  table{border-collapse:collapse;width:100%;min-width:540px;font-size:13px}
  th{text-align:left;font-size:11px;font-weight:600;color:var(--ink-3);
     padding:0 12px 7px 0;border-bottom:1px solid var(--rule);white-space:nowrap}
  td{padding:8px 12px 8px 0;border-bottom:1px solid var(--rule-2);color:var(--ink-2);vertical-align:top}
  td:first-child{color:var(--ink);font-weight:500}
  td.w{font-family:"IBM Plex Mono",monospace;color:var(--ink-3);white-space:nowrap}

  footer{margin-top:40px;padding-top:18px;border-top:1px solid var(--rule);
         font-size:12px;color:var(--ink-3);max-width:64ch}
  :focus-visible{outline:2px solid var(--accent);outline-offset:2px}
  @media (prefers-reduced-motion:reduce){*{transition:none!important}}
  @media (max-width:600px){
    .c-head,.pick-row{grid-template-columns:46px 1fr}
    .pickwrap{grid-column:1/-1;margin-top:8px}
    .pop{right:auto;left:0}
  }
</style>

<div class="wrap">
  <header>
    <h1>공모전 보드</h1>
    <p class="sub">한동대 학부생 지원 가능 · Web3 / AI / 생성형 AI / 마케팅</p>
    <div class="statusline">
      <span>기준일 <b class="mono" id="today">—</b></span>
      <span>접수중 <b class="mono" id="n-open">—</b>건</span>
      <span class="led" id="led" data-s="init"><i></i><span id="led-t">연결 중</span></span>
    </div>
  </header>

  <nav class="tabs" id="tabs" role="tablist"></nav>

  <section id="v-all" role="tabpanel"></section>

  <section id="v-pick" role="tabpanel" hidden>
    <div class="legend">
      <span><i style="background:var(--tae)"></i>태영</span>
      <span><i style="background:var(--jian)"></i>지안</span>
      <span><i style="background:var(--both)"></i>둘 다 선택</span>
    </div>
    <div id="picked"></div>
  </section>

  <details class="past" id="past">
    <summary>올해는 끝났지만 내년에 노릴 것</summary>
    <div class="past-wrap">
      <table>
        <thead><tr><th>대회</th><th>주최</th><th>접수 시기</th><th>규모 · 메모</th></tr></thead>
        <tbody id="past-body"></tbody>
      </table>
    </div>
  </details>

  <footer>D-day는 한국 시각 기준으로 자동 갱신됩니다. 요강은 바뀔 수 있으니 지원 전 공고문을 확인하세요.</footer>
</div>

<script>
(function(){
  "use strict";

  /* ---------- KST 날짜 ---------- */
  function kstParts(){
    var k = new Date(Date.now() + 9*60*60000);
    return { y:k.getUTCFullYear(), m:k.getUTCMonth()+1, d:k.getUTCDate() };
  }
  var KP = kstParts();
  var TODAY = new Date(Date.UTC(KP.y, KP.m-1, KP.d));
  var Y = 2026;
  function d(m, day, hh){
    return new Date(Date.UTC(Y, m-1, day, hh===undefined?23:hh, hh===undefined?59:0, 0, 0));
  }
  function days(to){
    return Math.round((Date.UTC(to.getUTCFullYear(), to.getUTCMonth(), to.getUTCDate()) - TODAY) / 86400000);
  }
  function md(x){ return (x.getUTCMonth()+1) + "/" + x.getUTCDate(); }
  function esc(s){ return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }

  var GROUPS = [
    { id:"web3",   label:"Web3 · 블록체인",
      note:"국내에서 학부생이 실제로 지원 가능한 Web3 트랙은 많지 않습니다. 아래 네 건이 지금 열려 있는 사실상 전부에 가깝고, 그중 GWDC는 국내 대학(원)생 전용이라 경쟁 구도가 가장 유리합니다." },
    { id:"build",  label:"AI 개발 · 데이터 경진대회",
      note:"코드나 프로토타입을 제출하는 트랙입니다. 대부분 예선은 기획서·서면으로 거르고, 본선에서 실제 구현물을 요구합니다." },
    { id:"med",    label:"의료 · 바이오 AI",
      note:"보건의료 데이터로 예측 모델을 만드는 트랙입니다. 지안이 하는 PPG 기반 혈압·심박 예측과 직접 맞닿는 영역입니다." },
    { id:"idea",   label:"AI 창업 · 기획 · 아이디어",
      note:"개발물 없이 기획서와 발표만으로 겨루는 트랙입니다. 팀 빌딩이 어렵거나 시간이 부족할 때 현실적인 선택지입니다." },
    { id:"gen",    label:"생성형 AI 콘텐츠 · 광고",
      note:"마케팅 관심과 생성형 AI가 겹치는 지점입니다. 진입장벽이 가장 낮고 상금 대비 투입 시간이 짧지만, AI 툴의 상업적 이용 라이선스 조건을 반드시 확인해야 합니다." },
    { id:"paper",  label:"논문 · 네이밍 · 기타",
      note:"제출물 형태가 다른 것들입니다. 짧게 붙어볼 만한 건도 섞여 있습니다." }
  ];

  var C = [
  /* ============ WEB3 ============ */
  {
    g:"web3", name:"GWDC 2026 Korea 해커톤", org:"Web3Labs · GWDC 2026 Korea 조직위원회",
    start:d(8,28), end:d(9,27), tags:["Web3","해커톤","오프라인","무료"], hero:true,

    "2026 AI·디지털 논문공모전":

    "AI노출지수 & 카나리아 대시보드 네이밍 공모전":
      ["명칭 아이디어 (한 줄)","doc","네이버폼에 이름과 제안 배경을 적어 제출. 주제별 3건씩 최대 6건까지 낼 수 있습니다."]
  };
  var DTYPE_LABEL = { doc:"문서", media:"미디어", build:"구현" };

  var PEOPLE = [{ id:"tae", name:"태영" }, { id:"jian", name:"지안" }];
  function pname(id){ return id==="tae" ? "태영" : "지안"; }

  /* ---------- 공유 상태 ---------- */
  var DB   = "https://hgu-contest-default-rtdb.asia-southeast1.firebasedatabase.app";
  var ROOT = "/v2";
  // DATA.picks[cid] = {tae:true, jian:true}
  // DATA.memos[cid] = {tae:"메모", jian:"메모"}   ← 사람별로 따로 적는다
  var DATA = { picks:{}, memos:{} };
  var LKEY = "hgu.board.v2";

  function cid(name){ return name.replace(/[.$#\[\]\/\s]/g,"").slice(0,40); }
  function norm(o){
    o = o || {};
    if(!o.picks || typeof o.picks !== "object") o.picks = {};
    if(!o.memos || typeof o.memos !== "object") o.memos = {};
    return o;
  }
  function loadLocal(){
    try{ DATA = norm(JSON.parse(localStorage.getItem(LKEY))); }catch(e){ DATA = norm(null); }
  }
  function saveLocal(){ try{ localStorage.setItem(LKEY, JSON.stringify(DATA)); }catch(e){} }

  var ledEl = document.getElementById("led"), ledT = document.getElementById("led-t");
  function led(s, t){ ledEl.setAttribute("data-s", s); ledT.textContent = t; }

  function applyAt(path, data, merge){
    if(path === "/" || path === ""){
      DATA = norm(data ? { picks:data.picks, memos:data.memos } : null);
      return;
    }
    var parts = path.split("/").filter(Boolean);
    if(parts[0] !== "picks" && parts[0] !== "memos") return;
    var last = parts.pop(), node = DATA;
    parts.forEach(function(p){
      if(typeof node[p] !== "object" || node[p] === null) node[p] = {};
      node = node[p];
    });
    if(data === null) delete node[last];
    else if(merge && typeof data === "object" && data !== null){
      if(typeof node[last] !== "object" || node[last] === null) node[last] = {};
      Object.keys(data).forEach(function(k){
        if(data[k] === null) delete node[last][k]; else node[last][k] = data[k];
      });
    } else node[last] = data;
    norm(DATA);
  }

  var fails = 0;
  function connect(){
    if(typeof EventSource === "undefined"){ led("off","실시간 미지원"); return; }
    var es;
    try{ es = new EventSource(DB + ROOT + ".json"); }
    catch(e){ led("off","연결 실패"); return; }
    function h(merge){
      return function(ev){
        var m; try{ m = JSON.parse(ev.data); }catch(e){ return; }
        if(!m) return;
        applyAt(m.path, m.data, merge);
        saveLocal(); render();
        fails = 0; led("live","실시간 연결됨");
      };
    }
    es.addEventListener("put", h(false));
    es.addEventListener("patch", h(true));
    es.onopen  = function(){ fails = 0; led("live","실시간 연결됨"); };
    es.onerror = function(){ if(++fails >= 2) led("off","동기화 끊김 · 이 기기에만 저장"); };
  }

  function push(path, value){
    saveLocal();
    fetch(DB + ROOT + path + ".json", {
      method: value === null ? "DELETE" : "PUT",
      headers: {"Content-Type":"application/json"},
      body: value === null ? undefined : JSON.stringify(value)
    }).then(function(r){ if(!r.ok) throw 0; })
      .catch(function(){ led("off","저장 실패 · 이 기기에만 저장"); });
  }

  function picked(name, who){ var p = DATA.picks[cid(name)]; return !!(p && p[who]); }
  function skipped(name){ var p = DATA.picks[cid(name)]; return !!(p && p.skip); }

  // 취소와 개인 선택은 같이 설 수 없다 — 취소는 "둘 다 못 한다"는 뜻이라서
  function toggle(name, who){
    var k = cid(name);
    if(!DATA.picks[k]) DATA.picks[k] = {};
    var p = DATA.picks[k];
    if(who === "skip"){
      if(p.skip){ delete p.skip; push("/picks/"+k+"/skip", null); }
      else{
        PEOPLE.forEach(function(x){
          if(p[x.id]){ delete p[x.id]; push("/picks/"+k+"/"+x.id, null); }
        });
        p.skip = true; push("/picks/"+k+"/skip", true);
      }
    } else {
      if(p[who]){ delete p[who]; push("/picks/"+k+"/"+who, null); }
      else{
        if(p.skip){ delete p.skip; push("/picks/"+k+"/skip", null); }
        p[who] = true; push("/picks/"+k+"/"+who, true);
      }
    }
    render();
  }

  function memoOf(name, who){ var m = DATA.memos[cid(name)]; return (m && m[who]) || ""; }
  function setMemo(name, who, text){
    var k = cid(name);
    if(!DATA.memos[k]) DATA.memos[k] = {};
    text = text.trim();
    if(!text){ delete DATA.memos[k][who]; push("/memos/"+k+"/"+who, null); }
    else { DATA.memos[k][who] = text; push("/memos/"+k+"/"+who, text); }
  }

  /* ---------- 렌더 ---------- */
  function ddayHTML(c){
    if(c.rolling) return '<div class="c-d">상시<small>수시 접수</small></div>';
    var n = days(c.end);
    var t = n < 0 ? "마감" : "D-" + n;
    return '<div class="c-d' + (n >= 0 && n <= 7 ? " hot" : "") + '">' + t +
           '<small>' + md(c.end) + '</small></div>';
  }
  function dvChip(name){
    var d = DELIVER[name];
    if(!d) return "";
    return '<span class="dv" data-t="' + d[1] + '"><i>' + DTYPE_LABEL[d[1]] + '</i>' + esc(d[0]) + '</span>';
  }
  function whoHTML(name){
    if(skipped(name)) return '<div class="who"><span class="tag" data-w="skip">취소</span></div>';
    var t = picked(name,"tae"), j = picked(name,"jian");
    if(!t && !j) return "";
    var h = '<div class="who">';
    if(t && j) h += '<span class="tag" data-w="both">둘 다 선택</span>';
    else if(t) h += '<span class="tag" data-w="tae">태영</span>';
    else       h += '<span class="tag" data-w="jian">지안</span>';
    return h + '</div>';
  }
  function pickBtn(name){
    var t = picked(name,"tae"), j = picked(name,"jian"), s = skipped(name);
    var label = s ? "취소됨" : ((t||j) ? "선택됨" : "선택");
    return '<div class="pickwrap"><button class="pickbtn" type="button" data-pick="' + esc(name) +
           '" data-has="' + ((t||j||s)?"1":"0") + '" data-skip="' + (s?"1":"0") +
           '" aria-expanded="false">' + label + ' ▾</button></div>';
  }

  var allEl = document.getElementById("v-all");
  function renderAll(){
    var open = 0, h = "";
    GROUPS.forEach(function(g){
      var items = C.filter(function(c){ return c.g === g.id; })
                   .sort(function(a,b){ return a.end - b.end; });
      if(!items.length) return;
      h += '<div class="topic"><div class="topic-h"><h2>' + esc(g.label) +
           '</h2><span class="n">' + items.length + '</span></div>';
      items.forEach(function(c){
        if(c.rolling || days(c.end) >= 0) open++;
        h += '<article class="c" id="c-' + cid(c.name) + '"' + (skipped(c.name)?' data-skip="1"':'') +
             '><div class="c-head">' + ddayHTML(c) +
             '<div><p class="c-title"><a href="' + esc(c.url) + '" target="_blank" rel="noopener">' +
             esc(c.name) + '</a></p><p class="c-org">' + esc(c.org) + '</p>' +
             dvChip(c.name) + whoHTML(c.name) + '</div>' +
             pickBtn(c.name) + '</div>';
        h += '<div class="c-body"><dl>';
        var dv = DELIVER[c.name];
        if(dv) h += '<dt>제출물</dt><dd><b>' + esc(dv[0]) + '</b><br>' + esc(dv[2]) + '</dd>';
        h += '<dt>참가자격</dt><dd><b>' + esc(c.who) + '</b></dd>';
        if(c.team && c.team !== "—") h += '<dt>팀 구성</dt><dd>' + esc(c.team) + '</dd>';
        h += '<dt>시상</dt><dd class="mono">' + esc(c.prize) + '</dd>';
        h += '<dt>주제</dt><dd>' + esc(c.topic) + '</dd>';
        if(c.sched) h += '<dt>일정</dt><dd>' + esc(c.sched) + '</dd>';
        if(c.place) h += '<dt>장소</dt><dd>' + esc(c.place) + '</dd>';
        h += '</dl>';
        if(c.note) h += '<p class="p-note">' + esc(c.note) + '</p>';
        if(c.warn) h += '<p class="p-warn">' + esc(c.warn) + '</p>';
        h += '<a class="go" href="' + esc(c.url) + '" target="_blank" rel="noopener">공고 열기 →</a>';
        h += '</div></article>';
      });
      h += '</div>';
    });
    allEl.innerHTML = h;
    document.getElementById("n-open").textContent = open;
  }

  var pickedEl = document.getElementById("picked");
  function renderPicked(){
    var h = "", total = 0;
    PEOPLE.forEach(function(p){
      var mine = C.filter(function(c){ return picked(c.name, p.id); });
      total += mine.length;
      h += '<div class="person"><div class="person-h" data-p="' + p.id + '"><h2>' + p.name +
           '</h2><span class="n">' + mine.length + '건</span></div>';
      if(!mine.length){ h += '<p class="empty">아직 선택한 공모전이 없습니다.</p></div>'; return; }
      GROUPS.forEach(function(g){
        var items = mine.filter(function(c){ return c.g === g.id; })
                        .sort(function(a,b){ return a.end - b.end; });
        if(!items.length) return;
        h += '<div class="sub-topic"><h3>' + esc(g.label) + '</h3>';
        items.forEach(function(c){
          var both = picked(c.name,"tae") && picked(c.name,"jian");
          var other = p.id === "tae" ? "jian" : "tae";
          var mineMemo = memoOf(c.name, p.id);
          var theirMemo = both ? memoOf(c.name, other) : "";

          h += '<div class="pick-row' + (both?" both":"") + '">' + ddayHTML(c) +
               '<div><a href="#c-' + cid(c.name) + '" data-jump="' + esc(c.name) + '">' +
               esc(c.name) + '</a>' +
               '<span class="sub2">' + (DELIVER[c.name] ? esc(DELIVER[c.name][0]) + ' · ' : '') +
               esc(c.prize) + '</span></div>' +
               (both ? '<span class="tag" data-w="both">둘 다</span>' : '<span></span>') +
               '<div class="memo-line">' +
               '<span class="memo-tag" data-w="' + p.id + '">메모</span>' +
               '<textarea class="memo" rows="1" data-n="' + esc(c.name) + '" data-w="' + p.id + '"' +
               ' aria-label="' + esc(p.name) + ' 메모"' +
               ' placeholder="어떤 아이템으로 나갈지, 뭘 맡을지">' +
               esc(mineMemo) + '</textarea></div>';

          // 둘 다 고른 건은 상대 메모도 같이 보여준다 (읽기 전용)
          if(both && theirMemo){
            h += '<div class="memo-line peer">' +
                 '<span class="memo-tag" data-w="' + other + '">' + esc(pname(other)) + '</span>' +
                 '<span class="memo-text">' + esc(theirMemo) + '</span></div>';
          }
          h += '</div>';
        });
        h += '</div>';
      });
      h += '</div>';
    });
    // 입력 중인 메모가 있으면 그 값/커서를 기억해 뒀다가 다시 그린 뒤 되돌린다.
    // (상대가 픽을 바꾸면 SSE로 render()가 불려서, 이게 없으면 타이핑하던 글이 날아간다)
    var a = document.activeElement, keep = null;
    if(a && a.classList && a.classList.contains("memo")){
      keep = { n:a.getAttribute("data-n"), w:a.getAttribute("data-w"),
               v:a.value, s:a.selectionStart, e:a.selectionEnd };
    }

    pickedEl.innerHTML = h;

    if(keep){
      var back = pickedEl.querySelector('textarea.memo[data-n="' + cssEsc(keep.n) + '"][data-w="' + keep.w + '"]');
      if(back){
        back.value = keep.v;                    // 서버 값보다 내가 치던 글이 우선
        back.focus();
        try{ back.setSelectionRange(keep.s, keep.e); }catch(err){}
      }
    }
    autoGrowAll();

    var b = document.querySelector('#tabs [data-v="pick"] .n');
    if(b) b.textContent = total;
  }

  function cssEsc(s){ return String(s).replace(/["\\]/g, "\\$&"); }
  function autoGrow(t){
    // 탭이 숨겨져 있으면 scrollHeight가 0으로 나온다. 그때 높이를 박아두면
    // 탭을 열었을 때 칸이 찌그러지므로, 보일 때만 계산한다.
    if(t.offsetParent === null){ t.style.height = ""; return; }
    t.style.height = "auto";
    t.style.height = Math.max(t.scrollHeight, 28) + "px";
  }
  function autoGrowAll(){
    Array.prototype.forEach.call(pickedEl.querySelectorAll("textarea.memo"), autoGrow);
  }

  /* 메모 입력: 타이핑이 멎으면 저장 */
  var memoTimers = {};
  document.addEventListener("input", function(e){
    var t = e.target;
    if(!t.classList || !t.classList.contains("memo")) return;
    autoGrow(t);
    var n = t.getAttribute("data-n"), w = t.getAttribute("data-w"), key = w + "|" + n;
    clearTimeout(memoTimers[key]);
    var val = t.value;
    memoTimers[key] = setTimeout(function(){ setMemo(n, w, val); saveLocal(); }, 500);
  });
  // 포커스를 떠나면 대기 없이 바로 저장
  document.addEventListener("focusout", function(e){
    var t = e.target;
    if(!t.classList || !t.classList.contains("memo")) return;
    var n = t.getAttribute("data-n"), w = t.getAttribute("data-w"), key = w + "|" + n;
    clearTimeout(memoTimers[key]);
    setMemo(n, w, t.value); saveLocal();
  });

  function render(){ renderAll(); renderPicked(); }

  /* ---------- 선택 팝오버 ---------- */
  function closePop(){
    var p = document.querySelector(".pop");
    if(p){
      var b = p.parentNode.querySelector(".pickbtn");
      if(b) b.setAttribute("aria-expanded","false");
      p.remove();
    }
  }
  document.addEventListener("click", function(e){
    var btn = e.target.closest("[data-pick]");
    var inPop = e.target.closest(".pop");
    if(!btn && !inPop){ closePop(); return; }

    if(btn){
      var wasOpen = btn.getAttribute("aria-expanded") === "true";
      closePop();
      if(wasOpen) return;
      var name = btn.getAttribute("data-pick");
      var pop = document.createElement("div");
      pop.className = "pop";
      pop.innerHTML = PEOPLE.map(function(p){
        var on = picked(name, p.id);
        return '<button type="button" data-p="' + p.id + '" data-n="' + esc(name) +
               '" aria-pressed="' + (on?"true":"false") + '"><span class="box">' +
               (on?"✓":"") + '</span>' + p.name + '</button>';
      }).join("") + (function(){
        var on = skipped(name);
        return '<button type="button" data-p="skip" data-n="' + esc(name) +
               '" aria-pressed="' + (on?"true":"false") + '"><span class="box">' +
               (on?"✕":"") + '</span>취소</button>';
      })();
      btn.parentNode.appendChild(pop);
      btn.setAttribute("aria-expanded","true");
      return;
    }

    var pb = e.target.closest(".pop button");
    if(pb){ toggle(pb.getAttribute("data-n"), pb.getAttribute("data-p")); closePop(); }
  });
  document.addEventListener("keydown", function(e){ if(e.key === "Escape") closePop(); });

  /* ---------- 탭 ---------- */
  var VIEWS = [{id:"all", label:"공모전"}, {id:"pick", label:"선택 후보"}];
  var tabs = document.getElementById("tabs");
  tabs.innerHTML = VIEWS.map(function(v,i){
    return '<button type="button" role="tab" data-v="' + v.id + '" aria-selected="' + (i===0) + '">' +
           v.label + '<span class="n"></span></button>';
  }).join("");
  function showView(v){
    closePop();
    Array.prototype.forEach.call(tabs.querySelectorAll("button"), function(x){
      x.setAttribute("aria-selected", x.getAttribute("data-v") === v ? "true" : "false");
    });
    VIEWS.forEach(function(x){ document.getElementById("v-" + x.id).hidden = (x.id !== v); });
    document.getElementById("past").hidden = (v !== "all");
    if(v === "pick") autoGrowAll();   // 숨김 상태에서 못 잰 높이를 지금 다시 잡는다
  }
  tabs.addEventListener("click", function(e){
    var b = e.target.closest("button[data-v]");
    if(!b) return;
    showView(b.getAttribute("data-v"));
  });

  /* 선택 후보에서 공모전 이름을 누르면 공모전 탭의 해당 항목으로 이동 */
  document.addEventListener("click", function(e){
    var j = e.target.closest("[data-jump]");
    if(!j) return;
    e.preventDefault();
    showView("all");
    var el = document.getElementById("c-" + cid(j.getAttribute("data-jump")));
    if(!el) return;

    el.classList.remove("flash");
    void el.offsetWidth;                 // 연속 클릭 시 애니메이션 다시 태우기
    el.classList.add("flash");
    setTimeout(function(){ el.classList.remove("flash"); }, 1800);

    // 즉시 이동. smooth는 탭을 펼치며 레이아웃이 바뀌는 프레임에 걸면 취소되고,
    // requestAnimationFrame으로 미루면 탭이 백그라운드일 때 콜백이 안 돌아 아예 안 움직인다.
    // 동기 호출이 가장 확실하고, 어디로 왔는지는 위의 flash 하이라이트가 알려준다.
    el.scrollIntoView({ behavior: "auto", block: "center" });
  });

  /* ---------- 자정(KST) 갱신 ---------- */
  function refreshDate(){
    var p = kstParts();
    if(p.y===KP.y && p.m===KP.m && p.d===KP.d) return;
    KP = p; TODAY = new Date(Date.UTC(p.y, p.m-1, p.d));
    stamp(); render();
  }
  function stamp(){
    document.getElementById("today").textContent =
      KP.y + "." + (KP.m<10?"0":"") + KP.m + "." + (KP.d<10?"0":"") + KP.d;
  }
  setInterval(refreshDate, 60000);
  document.addEventListener("visibilitychange", function(){ if(!document.hidden) refreshDate(); });
  window.addEventListener("focus", refreshDate);

  /* ---------- 지난 대회 ---------- */
  var pb2 = document.getElementById("past-body");
  PAST.forEach(function(r){
    var tr = document.createElement("tr");
    tr.innerHTML = '<td>'+esc(r[0])+'</td><td>'+esc(r[1])+'</td><td class="w">'+esc(r[2])+'</td><td>'+esc(r[3])+'</td>';
    pb2.appendChild(tr);
  });

  /* ---------- 시작 ---------- */
  loadLocal(); stamp(); render(); connect();
  document.querySelector('#tabs [data-v="all"] .n').textContent = C.length;
})();
</script>
