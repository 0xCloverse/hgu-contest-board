<meta charset="utf-8">
<title>공모전 보드</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500;600&family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap">
<style>
  :root{
    --bg:#FAFAF9;
    --card:#FFFFFF;
    --ink:#1A1C1B;
    --ink-2:#4E5453;
    --ink-3:#868C8B;
    --rule:#E2E5E3;
    --rule-2:#EFF1EF;
    --accent:#2F6F5E;
    --tae:#2B5CA8;      --tae-bg:#E7EEF8;
    --jian:#A85B22;     --jian-bg:#F8EEE4;
    --both:#1E7A55;     --both-bg:#E2F1EA;
    --skip:#7D8483;     --skip-bg:#ECEEED;
    --warn:#9A3B2F;
    --hot:#B3352A;      --hot-bg:#FBEAE8;
    --on-solid:#FFFFFF;
    --dv-doc:#55606E;   --dv-doc-bg:#ECEFF2;
    --dv-media:#6B4A94; --dv-media-bg:#F0EAF7;
    --dv-build:#1F6B57; --dv-build-bg:#E3F0EB;
    /* 달력에서 공모전을 구분하는 색. 순서대로 돌아가며 배정된다 */
    --e1:#2B6CB0; --e2:#B05423; --e3:#2F7A55;
    --e4:#8B4A9C; --e5:#A03A4E; --e6:#4A6572; --e7:#8A6A0E;
  }
  @media (prefers-color-scheme:dark){
    :root:not([data-theme="light"]){
      --bg:#111413; --card:#191D1C; --ink:#E9EDEB; --ink-2:#A9B1AF; --ink-3:#7B8382;
      --rule:#2A302E; --rule-2:#222826; --accent:#7FC3AC;
      --tae:#8FB6EC;  --tae-bg:#1A2634;
      --jian:#E0A06A; --jian-bg:#2E2318;
      --both:#77CCA5; --both-bg:#1B3E31;
      --skip:#8B9391; --skip-bg:#242A28;
      --warn:#E89185; --hot:#EE8B80; --hot-bg:#33211F; --on-solid:#111413;
      --dv-doc:#A7B1BD;   --dv-doc-bg:#232A31;
      --dv-media:#C4A3E8; --dv-media-bg:#271E33;
      --dv-build:#7FC9AE; --dv-build-bg:#15291F;
      --e1:#7FB3EC; --e2:#E3A46E; --e3:#77CCA5;
      --e4:#C9A0E0; --e5:#E58A9C; --e6:#9FB4C0; --e7:#DDBB5C;
    }
  }
  :root[data-theme="dark"]{
    --bg:#111413; --card:#191D1C; --ink:#E9EDEB; --ink-2:#A9B1AF; --ink-3:#7B8382;
    --rule:#2A302E; --rule-2:#222826; --accent:#7FC3AC;
    --tae:#8FB6EC;  --tae-bg:#1A2634;
    --jian:#E0A06A; --jian-bg:#2E2318;
    --both:#77CCA5; --both-bg:#1B3E31;
    --skip:#8B9391; --skip-bg:#242A28;
    --warn:#E89185; --hot:#EE8B80; --hot-bg:#33211F; --on-solid:#111413;
    --dv-doc:#A7B1BD;   --dv-doc-bg:#232A31;
    --dv-media:#C4A3E8; --dv-media-bg:#271E33;
    --dv-build:#7FC9AE; --dv-build-bg:#15291F;
    --e1:#7FB3EC; --e2:#E3A46E; --e3:#77CCA5;
    --e4:#C9A0E0; --e5:#E58A9C; --e6:#9FB4C0; --e7:#DDBB5C;
  }

  *{box-sizing:border-box}
  body{
    background:var(--bg);color:var(--ink);
    font-family:"IBM Plex Sans KR","Apple SD Gothic Neo",system-ui,sans-serif;
    font-size:15px;line-height:1.6;-webkit-font-smoothing:antialiased;
  }
  .wrap{max-width:840px;margin:0 auto;padding:0 20px 90px}
  .mono{font-family:"IBM Plex Mono",monospace;font-variant-numeric:tabular-nums}

  /* ---- header ---- */
  header{padding:44px 0 0}
  h1{font-size:29px;font-weight:700;letter-spacing:-.02em;margin:0}
  .sub{color:var(--ink-3);font-size:13.5px;margin:6px 0 0}
  .statusline{
    display:flex;align-items:center;gap:16px;flex-wrap:wrap;
    margin-top:16px;font-size:12px;color:var(--ink-3);
  }
  .statusline .mono{color:var(--ink-2);font-weight:500}
  .led{display:inline-flex;align-items:center;gap:6px}
  .led i{width:7px;height:7px;border-radius:50%;background:var(--ink-3);display:block}
  .led[data-s="live"] i{background:var(--both)} .led[data-s="live"]{color:var(--both)}
  .led[data-s="off"]  i{background:var(--warn)} .led[data-s="off"]{color:var(--warn)}

  /* ---- tabs ---- */
  .tabs{
    display:flex;gap:24px;margin-top:26px;
    border-bottom:1px solid var(--rule);position:sticky;top:0;background:var(--bg);z-index:20;
  }
  .tabs button{
    background:none;border:none;padding:12px 0;cursor:pointer;
    font:600 15px/1 "IBM Plex Sans KR",sans-serif;color:var(--ink-3);
    border-bottom:2px solid transparent;margin-bottom:-1px;
  }
  .tabs button:hover{color:var(--ink)}
  .tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--ink)}
  .tabs .n{font-family:"IBM Plex Mono",monospace;font-size:12px;color:var(--ink-3);margin-left:6px}

  /* ---- topic section ---- */
  .topic{margin-top:38px}
  .topic-h{
    display:flex;align-items:baseline;gap:10px;
    padding-bottom:8px;border-bottom:1px solid var(--rule);
  }
  .topic-h h2{font-size:15px;font-weight:600;margin:0;letter-spacing:-.01em}
  .topic-h .n{font-family:"IBM Plex Mono",monospace;font-size:12px;color:var(--ink-3)}

  /* ---- competition ---- */
  .c{padding:20px 0;border-bottom:1px solid var(--rule-2);scroll-margin-top:72px}
  /* 선택 후보에서 넘어왔을 때 어디로 왔는지 잠깐 짚어준다 */
  .c.flash{animation:flash 1.8s ease-out}
  @keyframes flash{
    0%,25%{background:var(--both-bg);box-shadow:0 0 0 10px var(--both-bg)}
    100%  {background:transparent;box-shadow:0 0 0 10px transparent}
  }
  @media (prefers-reduced-motion:reduce){
    .c.flash{animation:none;background:var(--both-bg);box-shadow:0 0 0 10px var(--both-bg)}
  }
  /* 선택 후보의 공모전명은 상세로 가는 내부 링크 */
  .pick-row a[data-jump]{cursor:pointer}
  .pick-row a[data-jump]:hover{text-decoration:underline}
  .c-head{display:grid;grid-template-columns:54px 1fr auto;gap:0 14px;align-items:start}
  .c-d{font-family:"IBM Plex Mono",monospace;font-variant-numeric:tabular-nums;
       font-size:16px;font-weight:600;text-align:right;padding-top:1px}
  .c-d.hot{color:var(--hot)}
  .c-d small{display:block;font-size:10.5px;font-weight:500;color:var(--ink-3);margin-top:2px}
  .c-title{font-size:16px;font-weight:600;line-height:1.4;margin:0}
  .c-title a{color:var(--ink);text-decoration:none;border-bottom:1px solid transparent}
  .c-title a:hover{border-bottom-color:var(--ink-3)}
  .c-org{font-size:12.5px;color:var(--ink-3);margin:2px 0 0}

  /* 제출물 칩 — 문서 / 미디어 / 구현 */
  .dv{
    display:inline-flex;align-items:center;gap:6px;margin-top:8px;
    font-size:11.5px;font-weight:600;padding:4px 9px;border-radius:5px;
  }
  .dv i{
    font-family:"IBM Plex Mono",monospace;font-size:9.5px;font-weight:600;
    font-style:normal;opacity:.72;letter-spacing:.04em;
  }
  .dv[data-t="doc"]  {background:var(--dv-doc-bg);  color:var(--dv-doc)}
  .dv[data-t="media"]{background:var(--dv-media-bg);color:var(--dv-media)}
  .dv[data-t="build"]{background:var(--dv-build-bg);color:var(--dv-build)}

  /* ---- pick ---- */
  .pickwrap{position:relative}
  .pickbtn{
    font:500 12.5px/1 "IBM Plex Sans KR",sans-serif;padding:7px 12px;border-radius:6px;
    border:1px solid var(--rule);background:var(--card);color:var(--ink-2);cursor:pointer;white-space:nowrap;
  }
  .pickbtn:hover{border-color:var(--ink-3);color:var(--ink)}
  .pickbtn[data-has="1"]{border-style:solid}
  .pop{
    position:absolute;right:0;top:calc(100% + 6px);z-index:40;
    background:var(--card);border:1px solid var(--rule);border-radius:8px;
    box-shadow:0 6px 20px rgba(0,0,0,.13);padding:5px;min-width:132px;
  }
  .pop button{
    display:flex;align-items:center;gap:9px;width:100%;
    font:500 13.5px/1 "IBM Plex Sans KR",sans-serif;padding:9px 10px;border-radius:5px;
    border:none;background:none;color:var(--ink);cursor:pointer;text-align:left;
  }
  .pop button:hover{background:var(--rule-2)}
  .pop .box{
    width:15px;height:15px;border-radius:4px;border:1.5px solid var(--rule);flex:none;
    display:flex;align-items:center;justify-content:center;font-size:10px;color:var(--on-solid);
  }
  .pop button[aria-pressed="true"][data-p="tae"]  .box{background:var(--tae);border-color:var(--tae)}
  .pop button[aria-pressed="true"][data-p="jian"] .box{background:var(--jian);border-color:var(--jian)}
  .pop button[data-p="skip"]{margin-top:4px;padding-top:11px;border-top:1px solid var(--rule-2);color:var(--ink-2)}
  .pop button[aria-pressed="true"][data-p="skip"]{color:var(--skip)}
  .pop button[aria-pressed="true"][data-p="skip"] .box{background:var(--skip);border-color:var(--skip)}

  /* ---- 취소된 공모전 ---- */
  .c[data-skip="1"]{opacity:.42;transition:opacity .15s}
  .c[data-skip="1"]:hover{opacity:.8}
  .c[data-skip="1"] .c-title a{text-decoration:line-through;text-decoration-color:var(--skip);text-decoration-thickness:1.5px}
  .pickbtn[data-skip="1"]{color:var(--skip);border-color:var(--skip)}

  /* ---- who badges ---- */
  .who{display:flex;gap:5px;margin-top:7px;flex-wrap:wrap}
  .tag{
    font-family:"IBM Plex Mono",monospace;font-size:10.5px;font-weight:600;
    padding:3px 8px;border-radius:4px;letter-spacing:.02em;
  }
  .tag[data-w="tae"] {background:var(--tae-bg); color:var(--tae)}
  .tag[data-w="jian"]{background:var(--jian-bg);color:var(--jian)}
  .tag[data-w="both"]{background:var(--both-bg);color:var(--both)}
  .tag[data-w="skip"]{background:var(--skip-bg);color:var(--skip)}

  /* ---- details ---- */
  .c-body{margin-left:68px;margin-top:12px}
  @media (max-width:600px){ .c-body{margin-left:0} }
  dl{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;margin:0;font-size:13.5px}
  dt{color:var(--ink-3);font-size:11.5px;font-weight:500;white-space:nowrap;padding-top:3px}
  dd{margin:0;color:var(--ink-2)}
  dd b{color:var(--ink);font-weight:600}
  dd.mono{font-weight:500;color:var(--ink)}
  .p-note{font-size:13px;color:var(--ink-2);margin:11px 0 0;padding-left:11px;border-left:2px solid var(--rule)}
  .p-warn{font-size:13px;color:var(--warn);margin:8px 0 0;padding-left:11px;border-left:2px solid var(--warn)}
  .go{
    display:inline-block;margin-top:11px;font-family:"IBM Plex Mono",monospace;
    font-size:12px;color:var(--accent);text-decoration:none;
  }
  .go:hover{text-decoration:underline}

  /* ---- 선택 후보 ---- */
  .person{margin-top:34px}
  .person-h{display:flex;align-items:center;gap:10px;padding-bottom:9px;border-bottom:2px solid}
  .person-h[data-p="tae"] {border-color:var(--tae)}
  .person-h[data-p="jian"]{border-color:var(--jian)}
  .person-h h2{font-size:18px;font-weight:700;margin:0}
  .person-h[data-p="tae"]  h2{color:var(--tae)}
  .person-h[data-p="jian"] h2{color:var(--jian)}
  .person-h .n{font-family:"IBM Plex Mono",monospace;font-size:12.5px;color:var(--ink-3)}
  .sub-topic{margin-top:16px}
  .sub-topic h3{
    font-size:11.5px;font-weight:600;color:var(--ink-3);margin:0 0 4px;
    letter-spacing:.04em;
  }
  .pick-row{
    display:grid;grid-template-columns:54px 1fr auto;gap:0 14px;align-items:center;
    padding:9px 11px;border-radius:6px;margin-left:-11px;
  }
  .pick-row.both{background:var(--both-bg);box-shadow:inset 3px 0 0 var(--both)}
  .pick-row .c-d{font-size:14px}
  .pick-row.both .c-d{color:var(--both)}
  .pick-row a{color:var(--ink);text-decoration:none;font-size:14px;font-weight:500}
  .pick-row.both a{color:var(--both);font-weight:600}
  .pick-row a:hover{text-decoration:underline}
  .pick-row .sub2{display:block;font-size:11.5px;color:var(--ink-3);font-weight:400;margin-top:1px}

  /* 메모 — 라벨 + 본문. 비어 있을 땐 조용하고, 손대면 드러난다 */
  .memo-line{
    grid-column:2/-1;display:flex;align-items:flex-start;gap:9px;margin-top:7px;
  }
  .memo-line.peer{margin-top:2px}
  .memo-tag{
    font-family:"IBM Plex Mono",monospace;font-size:10.5px;font-weight:600;
    letter-spacing:.03em;color:var(--ink-3);flex:none;padding-top:9px;
  }
  .memo-tag[data-w="tae"] {color:var(--tae)}
  .memo-tag[data-w="jian"]{color:var(--jian)}
  textarea.memo{
    /* flex-start로 두지 않으면 컨테이너가 행 높이만큼 늘려버려서
       height:auto 측정값(scrollHeight)이 실제 내용 높이보다 커진다 */
    flex:1;min-width:0;display:block;
    font:400 13px/1.5 "IBM Plex Sans KR",sans-serif;color:var(--ink);
    background:transparent;border:1px solid transparent;border-radius:5px;
    padding:5px 8px;resize:none;overflow:hidden;min-height:28px;
  }
  textarea.memo::placeholder{color:var(--ink-3);opacity:.7}
  textarea.memo:hover{border-color:var(--rule)}
  textarea.memo:focus{outline:none;border-color:var(--accent);background:var(--card)}
  .pick-row.both textarea.memo:focus{background:var(--bg)}
  .memo-text{
    flex:1;min-width:0;padding:5px 8px;
    font-size:13px;line-height:1.5;color:var(--ink-2);
  }
  .empty{color:var(--ink-3);font-size:13.5px;padding:16px 0}
  .legend{
    display:flex;gap:16px;flex-wrap:wrap;margin-top:18px;
    font-size:12px;color:var(--ink-3);
  }
  .legend span{display:inline-flex;align-items:center;gap:6px}
  .legend i{width:11px;height:11px;border-radius:3px;display:block}

  /* ---- 최종 선택 ---- */
  .fin-note{font-size:13px;color:var(--ink-2);margin:18px 0 14px}
  .fin-note b{color:var(--both);font-weight:600}
  .fin{
    display:grid;grid-template-columns:54px 1fr;gap:0 14px;align-items:start;
    padding:13px 11px;border-radius:6px;margin:0 0 8px -11px;
    background:var(--both-bg);box-shadow:inset 3px 0 0 var(--both);
  }
  .fin .c-d{font-size:14px;color:var(--both)}
  .fin a{color:var(--both);text-decoration:none;font-size:15px;font-weight:600}
  .fin a:hover{text-decoration:underline}
  .fin-org{display:block;font-size:11.5px;color:var(--ink-3);margin-top:1px}
  .fin-meta{font-family:"IBM Plex Mono",monospace;font-size:11.5px;color:var(--ink-2);margin-top:6px}

  /* ---- 달력 ---- */
  .cal,.ag{margin-top:34px}
  .cal-h{display:flex;align-items:baseline;gap:10px;padding-bottom:8px;border-bottom:1px solid var(--rule)}
  .cal-h h2{font-size:15px;font-weight:600;margin:0;letter-spacing:-.01em}
  .cal-h .n{font-family:"IBM Plex Mono",monospace;font-size:12px;color:var(--ink-3)}
  .cal-m{margin-top:22px}
  .cal-m h3{
    font-family:"IBM Plex Mono",monospace;font-size:12.5px;font-weight:600;
    color:var(--ink-2);margin:0 0 7px;letter-spacing:.03em;
  }
  .cal-g{
    display:grid;grid-template-columns:repeat(7,minmax(0,1fr));
    border-top:1px solid var(--rule);border-left:1px solid var(--rule-2);
  }
  .cal-w{
    font-size:10.5px;color:var(--ink-3);text-align:center;padding:5px 0;
    border-right:1px solid var(--rule-2);border-bottom:1px solid var(--rule-2);
  }
  .cal-d{
    min-height:76px;padding:4px 4px 6px;overflow:hidden;
    border-right:1px solid var(--rule-2);border-bottom:1px solid var(--rule-2);
  }
  .cal-d .dn{font-family:"IBM Plex Mono",monospace;font-size:11px;color:var(--ink-3);display:block}
  .cal-d.off{background:var(--rule-2);opacity:.3}
  .cal-d.was .dn{opacity:.5}
  .cal-d.was .ev{opacity:.45}
  .cal-d.now{box-shadow:inset 0 0 0 2px var(--accent)}
  .cal-d.now .dn{color:var(--accent);font-weight:700}
  .ev{
    display:block;width:100%;margin-top:3px;padding:2px 4px;border:none;border-radius:3px;
    font-family:inherit;font-size:10.5px;line-height:1.35;text-align:left;cursor:pointer;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  }
  .ev:hover{filter:brightness(1.06);box-shadow:0 0 0 1px var(--c)}
  .ev b{font-weight:600}
  /* 색(--c)은 공모전별로 인라인 지정. 꽉 찬 칩이 접수 마감, 옅은 칩이 나머지 일정 */
  .ev[data-k="end"]{background:var(--c);color:var(--on-solid)}
  .ev[data-k="sched"]{
    background:var(--rule-2);                              /* color-mix 미지원 대비 */
    background:color-mix(in srgb, var(--c) 16%, transparent);
    color:var(--c);
  }

  /* ---- 달력 넘기기 ---- */
  .cal-nav{display:flex;align-items:center;gap:10px;margin-top:16px}
  .cal-b{
    width:30px;height:30px;flex:none;border-radius:6px;border:1px solid var(--rule);
    background:var(--card);color:var(--ink-2);cursor:pointer;
    font:600 15px/1 "IBM Plex Mono",monospace;
  }
  .cal-b:hover:not(:disabled){border-color:var(--ink-3);color:var(--ink)}
  .cal-b:disabled{opacity:.3;cursor:default}
  .cal-t{
    font-family:"IBM Plex Mono",monospace;font-size:14.5px;font-weight:600;
    color:var(--ink);min-width:78px;text-align:center;
  }
  .cal-i{font-family:"IBM Plex Mono",monospace;font-size:11.5px;color:var(--ink-3);margin-left:auto}
  .cal-leg{margin-top:14px}
  .cal-leg i{border-radius:3px}

  /* ---- 일정 상세 시트 ---- */
  .sheet{
    position:fixed;inset:0;z-index:60;
    display:flex;align-items:center;justify-content:center;padding:20px;
  }
  .sheet[hidden]{display:none}
  .sheet-bd{position:absolute;inset:0;background:rgba(0,0,0,.42)}
  .sheet-c{
    position:relative;width:100%;max-width:390px;max-height:82vh;overflow-y:auto;
    background:var(--card);border:1px solid var(--rule);border-radius:12px;
    box-shadow:0 16px 48px rgba(0,0,0,.26);padding:18px 18px 16px;
  }
  .sheet-h{display:flex;align-items:flex-start;gap:11px}
  .sheet-d{
    flex:none;font-family:"IBM Plex Mono",monospace;font-size:12px;font-weight:600;
    padding:5px 9px;border-radius:5px;background:var(--c);color:var(--on-solid);
  }
  .sheet-t{flex:1;font-size:16px;font-weight:600;line-height:1.4;margin:2px 0 0}
  .sheet-x{
    flex:none;width:28px;height:28px;border-radius:6px;border:1px solid var(--rule);
    background:none;color:var(--ink-3);cursor:pointer;font-size:13px;line-height:1;
  }
  .sheet-x:hover{color:var(--ink);border-color:var(--ink-3)}
  .sheet-meta{
    font-family:"IBM Plex Mono",monospace;font-size:12px;color:var(--ink-2);
    margin:9px 0 0;padding-left:1px;
  }
  .sheet-name{
    display:flex;align-items:baseline;gap:7px;
    font-size:12.5px;color:var(--ink-3);margin:12px 0 0;line-height:1.45;
    padding-top:11px;border-top:1px solid var(--rule-2);
  }
  .sheet-name i{flex:none;width:8px;height:8px;border-radius:2px;background:var(--c)}
  .sheet-auto{font-size:11.5px;color:var(--ink-3);margin:8px 0 0}
  .sheet-go{display:flex;gap:16px;flex-wrap:wrap;margin-top:13px}

  /* ---- 직접 추가 ---- */
  .addbar{display:flex;justify-content:flex-end;align-items:center;gap:10px;margin:18px 0 -6px}
  .addbar span{font-size:12px;color:var(--ink-3)}
  .addbtn{

    "2026 AI·디지털 논문공모전":
      ["논문 A4 15~25매","doc","논문 본문·요약서와 함께 연구윤리 준수서약서, KCI 문헌 유사도 검사 결과 확인서가 필요합니다. 유사도 검사에 시간이 걸리니 미리 돌려두세요."],
    "AI노출지수 & 카나리아 대시보드 네이밍 공모전":
      ["명칭 아이디어 (한 줄)","doc","네이버폼에 이름과 제안 배경을 적어 제출. 주제별 3건씩 최대 6건까지 낼 수 있습니다."]
  };
  var DTYPE_LABEL = { doc:"문서", media:"미디어", build:"구현" };

  var PEOPLE = [{ id:"tae", name:"태영" }, { id:"jian", name:"지안" }];
  function pname(id){ return id==="tae" ? "태영" : "지안"; }

  /* ---------- 공유 상태 ---------- */
  var DB   = "https://hgu-contest-default-rtdb.asia-southeast1.firebasedatabase.app";
  var ROOT = "/v2";
  // DATA.picks[cid] = {tae:true, jian:true}
  // DATA.memos[cid] = {tae:"메모", jian:"메모"}   ← 사람별로 따로 적는다
  // DATA.custom[key] = {g, name, url, end:"YYYY-MM-DD", time?:"HH:MM", memo?, by, at}  ← 보드에서 직접 추가, 정리 대기
  var DATA = { picks:{}, memos:{}, custom:{} };
  var LKEY = "hgu.board.v2";

  function cid(name){ return name.replace(/[.$#\[\]\/\s]/g,"").slice(0,40); }
  function norm(o){
    o = o || {};
    if(!o.picks || typeof o.picks !== "object") o.picks = {};
    if(!o.memos || typeof o.memos !== "object") o.memos = {};
    if(!o.custom || typeof o.custom !== "object") o.custom = {};
    return o;
  }
  function loadLocal(){
    try{ DATA = norm(JSON.parse(localStorage.getItem(LKEY))); }catch(e){ DATA = norm(null); }
  }
  function saveLocal(){ try{ localStorage.setItem(LKEY, JSON.stringify(DATA)); }catch(e){} }

  var ledEl = document.getElementById("led"), ledT = document.getElementById("led-t");
  function led(s, t){ ledEl.setAttribute("data-s", s); ledT.textContent = t; }

  function applyAt(path, data, merge){
    if(path === "/" || path === ""){
      DATA = norm(data ? { picks:data.picks, memos:data.memos, custom:data.custom } : null);
      return;
    }
    var parts = path.split("/").filter(Boolean);
    if(parts[0] !== "picks" && parts[0] !== "memos" && parts[0] !== "custom") return;
    var last = parts.pop(), node = DATA;
    parts.forEach(function(p){
      if(typeof node[p] !== "object" || node[p] === null) node[p] = {};
      node = node[p];
    });
    if(data === null) delete node[last];
    else if(merge && typeof data === "object" && data !== null){
      if(typeof node[last] !== "object" || node[last] === null) node[last] = {};
      Object.keys(data).forEach(function(k){
        if(data[k] === null) delete node[last][k]; else node[last][k] = data[k];
      });
    } else node[last] = data;
    norm(DATA);
  }

  var fails = 0;
  function connect(){
    if(typeof EventSource === "undefined"){ led("off","실시간 미지원"); return; }
    var es;
    try{ es = new EventSource(DB + ROOT + ".json"); }
    catch(e){ led("off","연결 실패"); return; }
    function h(merge){
      return function(ev){
        var m; try{ m = JSON.parse(ev.data); }catch(e){ return; }
        if(!m) return;
        applyAt(m.path, m.data, merge);
        saveLocal(); render();
        fails = 0; led("live","실시간 연결됨");
      };
    }
    es.addEventListener("put", h(false));
    es.addEventListener("patch", h(true));
    es.onopen  = function(){ fails = 0; led("live","실시간 연결됨"); };
    es.onerror = function(){ if(++fails >= 2) led("off","동기화 끊김 · 이 기기에만 저장"); };
  }

  function push(path, value){
    saveLocal();
    fetch(DB + ROOT + path + ".json", {
      method: value === null ? "DELETE" : "PUT",
      headers: {"Content-Type":"application/json"},
      body: value === null ? undefined : JSON.stringify(value)
    }).then(function(r){ if(!r.ok) throw 0; })
      .catch(function(){ led("off","저장 실패 · 이 기기에만 저장"); });
  }

  function picked(name, who){ var p = DATA.picks[cid(name)]; return !!(p && p[who]); }
  function skipped(name){ var p = DATA.picks[cid(name)]; return !!(p && p.skip); }

  // 취소와 개인 선택은 같이 설 수 없다 — 취소는 "둘 다 못 한다"는 뜻이라서
  function toggle(name, who){
    var k = cid(name);
    if(!DATA.picks[k]) DATA.picks[k] = {};
    var p = DATA.picks[k];
    if(who === "skip"){
      if(p.skip){ delete p.skip; push("/picks/"+k+"/skip", null); }
      else{
        PEOPLE.forEach(function(x){
          if(p[x.id]){ delete p[x.id]; push("/picks/"+k+"/"+x.id, null); }
        });
        p.skip = true; push("/picks/"+k+"/skip", true);
      }
    } else {
      if(p[who]){ delete p[who]; push("/picks/"+k+"/"+who, null); }
      else{
        if(p.skip){ delete p.skip; push("/picks/"+k+"/skip", null); }
        p[who] = true; push("/picks/"+k+"/"+who, true);
      }
    }
    render();
  }

  function memoOf(name, who){ var m = DATA.memos[cid(name)]; return (m && m[who]) || ""; }
  function setMemo(name, who, text){
    var k = cid(name);
    if(!DATA.memos[k]) DATA.memos[k] = {};
    text = text.trim();
    if(!text){ delete DATA.memos[k][who]; push("/memos/"+k+"/"+who, null); }
    else { DATA.memos[k][who] = text; push("/memos/"+k+"/"+who, text); }
  }

  /* ---------- 렌더 ---------- */
  function ddayHTML(c){
    if(c.rolling) return '<div class="c-d">상시<small>수시 접수</small></div>';
    var n = days(c.end);
    var t = n < 0 ? "마감" : "D-" + n;
    return '<div class="c-d' + (n >= 0 && n <= 7 ? " hot" : "") + '">' + t +
           '<small>' + md(c.end) + '</small></div>';
  }
  function dvChip(name){
    var d = DELIVER[name];
    if(!d) return "";
    return '<span class="dv" data-t="' + d[1] + '"><i>' + DTYPE_LABEL[d[1]] + '</i>' + esc(d[0]) + '</span>';
  }
  function whoHTML(name){
    if(skipped(name)) return '<div class="who"><span class="tag" data-w="skip">취소</span></div>';
    var t = picked(name,"tae"), j = picked(name,"jian");
    if(!t && !j) return "";
    var h = '<div class="who">';
    if(t && j) h += '<span class="tag" data-w="both">둘 다 선택</span>';
    else if(t) h += '<span class="tag" data-w="tae">태영</span>';
    else       h += '<span class="tag" data-w="jian">지안</span>';
    return h + '</div>';
  }
  function pickBtn(name){
    var t = picked(name,"tae"), j = picked(name,"jian"), s = skipped(name);
    var label = s ? "취소됨" : ((t||j) ? "선택됨" : "선택");
    return '<div class="pickwrap"><button class="pickbtn" type="button" data-pick="' + esc(name) +
           '" data-has="' + ((t||j||s)?"1":"0") + '" data-skip="' + (s?"1":"0") +
           '" aria-expanded="false">' + label + ' ▾</button></div>';
  }

  // 보드에서 직접 추가한 공모전. 같은 이름이 C에 정식으로 들어오면(=Claude가 정리하면) 숨긴다.
  function customList(){
    var known = {};
    C.forEach(function(c){ known[cid(c.name)] = 1; });
    return Object.keys(DATA.custom).map(function(k){
      var o = DATA.custom[k];
      if(!o || !o.name || !o.end || known[cid(o.name)]) return null;
      var m = String(o.end).match(/^(\d{4})-(\d{2})-(\d{2})$/);
      if(!m) return null;
      var t = String(o.time || "").match(/^(\d{2}):(\d{2})$/);
      var end = new Date(Date.UTC(+m[1], +m[2]-1, +m[3], t ? +t[1] : 23, t ? +t[2] : 59));
      end.hasTime = !!t;
      var g = GROUPS.some(function(x){ return x.id === o.g; }) ? o.g : GROUPS[GROUPS.length-1].id;
      return { g:g, name:o.name, org:"직접 추가 · " + (o.by === "jian" ? "지안" : "태영"),
               end:end, url:o.url || "#", note:o.memo || "", pending:true, key:k, by:o.by, at:o.at };
    }).filter(Boolean);
  }
  function allC(){ return C.concat(customList()); }

  function isClosed(c){ return !c.rolling && days(c.end) < 0; }

  function pendingCard(c){
    var at = c.at ? new Date(c.at + 9*3600000) : null;
    return '<article class="c" id="c-' + cid(c.name) + '"' + (skipped(c.name)?' data-skip="1"':'') +
      '><div class="c-head">' + ddayHTML(c) +
      '<div><p class="c-title"><a href="' + esc(c.url) + '" target="_blank" rel="noopener">' + esc(c.name) +
      '</a></p><p class="c-org">' + esc(c.org) + '</p><div class="who"><span class="tag" data-w="pend">정리 대기</span></div>' +
      whoHTML(c.name) + '</div>' + pickBtn(c.name) + '</div>' +
      '<div class="c-body"><dl><dt>상태</dt><dd>' +
      (at ? (at.getUTCMonth()+1) + "/" + at.getUTCDate() + "에 " : "") +
      '직접 추가함. 자격·시상·제출물은 Claude가 공고를 읽고 채울 예정입니다.' +
      (c.end.hasTime ? '' : ' 마감 시각은 모름.') + '</dd></dl>' +
      (c.note ? '<p class="p-note">' + esc(c.note) + '</p>' : '') +
      '<a class="go" href="' + esc(c.url) + '" target="_blank" rel="noopener">공고 열기 →</a>' +
      '<button type="button" class="delbtn" data-del="' + esc(c.key) + '">삭제</button>' +
      '</div></article>';
  }

  function cardHTML(c){
    if(c.pending) return pendingCard(c);
    var h = "";
    h += '<article class="c" id="c-' + cid(c.name) + '"' + (skipped(c.name)?' data-skip="1"':'') +
             '><div class="c-head">' + ddayHTML(c) +
             '<div><p class="c-title"><a href="' + esc(c.url) + '" target="_blank" rel="noopener">' +
             esc(c.name) + '</a></p><p class="c-org">' + esc(c.org) + '</p>' +
             dvChip(c.name) + whoHTML(c.name) + '</div>' +
             pickBtn(c.name) + '</div>';
    h += '<div class="c-body"><dl>';
    var dv = DELIVER[c.name];
    if(dv) h += '<dt>제출물</dt><dd><b>' + esc(dv[0]) + '</b><br>' + esc(dv[2]) + '</dd>';
    h += '<dt>참가자격</dt><dd><b>' + esc(c.who) + '</b></dd>';
    if(c.team && c.team !== "—") h += '<dt>팀 구성</dt><dd>' + esc(c.team) + '</dd>';
    h += '<dt>시상</dt><dd class="mono">' + esc(c.prize) + '</dd>';
    h += '<dt>주제</dt><dd>' + esc(c.topic) + '</dd>';
    if(c.sched) h += '<dt>일정</dt><dd>' + esc(c.sched) + '</dd>';
    if(c.place) h += '<dt>장소</dt><dd>' + esc(c.place) + '</dd>';
    h += '</dl>';
    if(c.note) h += '<p class="p-note">' + esc(c.note) + '</p>';
    if(c.warn) h += '<p class="p-warn">' + esc(c.warn) + '</p>';
    h += '<a class="go" href="' + esc(c.url) + '" target="_blank" rel="noopener">공고 열기 →</a>';
    h += '</div></article>';
    return h;
  }

  // 같은 주제 묶음으로 카드를 그린다. 마감 탭은 최근에 마감된 것부터.
  function groupedHTML(list, newestFirst){
    var h = "";
    GROUPS.forEach(function(g){
      var items = list.filter(function(c){ return c.g === g.id; })
                      .sort(function(a,b){ return newestFirst ? b.end - a.end : a.end - b.end; });
      if(!items.length) return;
      h += '<div class="topic"><div class="topic-h"><h2>' + esc(g.label) +
           '</h2><span class="n">' + items.length + '</span></div>';
      items.forEach(function(c){ h += cardHTML(c); });
      h += '</div>';
    });
    return h;
  }

  var allEl = document.getElementById("v-all");
  var closedEl = document.getElementById("v-closed");
  function renderAll(){
    var everything = allC();
    var openList = everything.filter(function(c){ return !isClosed(c); });
    var closedList = everything.filter(isClosed);
    var nPend = everything.filter(function(c){ return c.pending; }).length;
    allEl.innerHTML = '<div class="addbar">' + (nPend ? '<span>정리 대기 ' + nPend + '건</span>' : '') +
      '<button type="button" class="addbtn" id="addopen">+ 공모전 추가</button></div>' +
      (groupedHTML(openList, false) || '<p class="p-note">지금 접수 중인 공모전이 없습니다.</p>');
    closedEl.innerHTML = '<p class="p-note">접수가 끝난 공모전입니다. 선택·메모는 그대로 남아 있습니다.</p>' +
      groupedHTML(closedList, true);
    document.getElementById("n-open").textContent = openList.length;
    document.querySelector('#tabs [data-v="all"] .n').textContent = openList.length;
    document.querySelector('#tabs [data-v="closed"] .n').textContent = closedList.length;
  }

  var pickedEl = document.getElementById("picked");
  function renderPicked(){
    var h = "", total = 0;
    PEOPLE.forEach(function(p){
      var mine = allC().filter(function(c){ return picked(c.name, p.id); });
      total += mine.length;
      h += '<div class="person"><div class="person-h" data-p="' + p.id + '"><h2>' + p.name +
           '</h2><span class="n">' + mine.length + '건</span></div>';
      if(!mine.length){ h += '<p class="empty">아직 선택한 공모전이 없습니다.</p></div>'; return; }
      GROUPS.forEach(function(g){
        var items = mine.filter(function(c){ return c.g === g.id; })
                        .sort(function(a,b){ return a.end - b.end; });
        if(!items.length) return;
        h += '<div class="sub-topic"><h3>' + esc(g.label) + '</h3>';
        items.forEach(function(c){
          var both = picked(c.name,"tae") && picked(c.name,"jian");
          var other = p.id === "tae" ? "jian" : "tae";
          var mineMemo = memoOf(c.name, p.id);
          var theirMemo = both ? memoOf(c.name, other) : "";

          h += '<div class="pick-row' + (both?" both":"") + '">' + ddayHTML(c) +
               '<div><a href="#c-' + cid(c.name) + '" data-jump="' + esc(c.name) + '">' +
               esc(c.name) + '</a>' +
               '<span class="sub2">' + (DELIVER[c.name] ? esc(DELIVER[c.name][0]) + ' · ' : '') +
               esc(c.prize) + '</span></div>' +
               (both ? '<span class="tag" data-w="both">둘 다</span>' : '<span></span>') +
               '<div class="memo-line">' +
               '<span class="memo-tag" data-w="' + p.id + '">메모</span>' +
               '<textarea class="memo" rows="1" data-n="' + esc(c.name) + '" data-w="' + p.id + '"' +
               ' aria-label="' + esc(p.name) + ' 메모"' +
               ' placeholder="어떤 아이템으로 나갈지, 뭘 맡을지">' +
               esc(mineMemo) + '</textarea></div>';

          // 둘 다 고른 건은 상대 메모도 같이 보여준다 (읽기 전용)
          if(both && theirMemo){
            h += '<div class="memo-line peer">' +
                 '<span class="memo-tag" data-w="' + other + '">' + esc(pname(other)) + '</span>' +
                 '<span class="memo-text">' + esc(theirMemo) + '</span></div>';
          }
          h += '</div>';
        });
        h += '</div>';
      });
      h += '</div>';
    });
    // 입력 중인 메모가 있으면 그 값/커서를 기억해 뒀다가 다시 그린 뒤 되돌린다.
    // (상대가 픽을 바꾸면 SSE로 render()가 불려서, 이게 없으면 타이핑하던 글이 날아간다)
    var a = document.activeElement, keep = null;
    if(a && a.classList && a.classList.contains("memo")){
      keep = { n:a.getAttribute("data-n"), w:a.getAttribute("data-w"),
               v:a.value, s:a.selectionStart, e:a.selectionEnd };
    }

    pickedEl.innerHTML = h;

    if(keep){
      var back = pickedEl.querySelector('textarea.memo[data-n="' + cssEsc(keep.n) + '"][data-w="' + keep.w + '"]');
      if(back){
        back.value = keep.v;                    // 서버 값보다 내가 치던 글이 우선
        back.focus();
        try{ back.setSelectionRange(keep.s, keep.e); }catch(err){}
      }
    }
    autoGrowAll();

    var b = document.querySelector('#tabs [data-v="pick"] .n');
    if(b) b.textContent = total;
  }

  function cssEsc(s){ return String(s).replace(/["\\]/g, "\\$&"); }
  function autoGrow(t){
    // 탭이 숨겨져 있으면 scrollHeight가 0으로 나온다. 그때 높이를 박아두면
    // 탭을 열었을 때 칸이 찌그러지므로, 보일 때만 계산한다.
    if(t.offsetParent === null){ t.style.height = ""; return; }
    t.style.height = "auto";
    t.style.height = Math.max(t.scrollHeight, 28) + "px";
  }
  function autoGrowAll(){
    Array.prototype.forEach.call(pickedEl.querySelectorAll("textarea.memo"), autoGrow);
  }

  /* 메모 입력: 타이핑이 멎으면 저장 */
  var memoTimers = {};
  document.addEventListener("input", function(e){
    var t = e.target;
    if(!t.classList || !t.classList.contains("memo")) return;
    autoGrow(t);
    var n = t.getAttribute("data-n"), w = t.getAttribute("data-w"), key = w + "|" + n;
    clearTimeout(memoTimers[key]);
    var val = t.value;
    memoTimers[key] = setTimeout(function(){ setMemo(n, w, val); saveLocal(); }, 500);
  });
  // 포커스를 떠나면 대기 없이 바로 저장
  document.addEventListener("focusout", function(e){
    var t = e.target;
    if(!t.classList || !t.classList.contains("memo")) return;
    var n = t.getAttribute("data-n"), w = t.getAttribute("data-w"), key = w + "|" + n;
    clearTimeout(memoTimers[key]);
    setMemo(n, w, t.value); saveLocal();
  });

  /* ---------- 최종 선택 ---------- */
  var finalEl = document.getElementById("v-final");
  var WD = ["일","월","화","수","목","금","토"];
  var PAL = 6;            // --e1 ~ --e6
  var calMonth = null;    // 지금 보고 있는 달(y*12+m). 넘겨 본 위치를 재렌더 후에도 유지한다

  function agreed(){
    return allC().filter(function(c){
      return picked(c.name,"tae") && picked(c.name,"jian") && !skipped(c.name);
    }).sort(function(a,b){ return a.end - b.end; });
  }

  // 달력 칸에 들어갈 짧은 이름. 괄호 브랜드(=BLOCK AI 26, iM뱅크)가 있으면 그걸 쓰고,
  // 없으면 연도·회차·"공모전" 같은 꼬리를 떼어낸다.
  function shortName(name){
    var m = name.match(/^[(（]([^)）]{3,20})[)）]/) || name.match(/[(（]([^)）]{3,20})[)）]\s*$/);
    var s = m ? m[1]
              : name.replace(/^\s*[\[［][^\]］]*[\]］]\s*/, "")   // 앞에 붙은 [주최] 꼬리표
                    .replace(/\s*20\d\d년?\s*/, " ").replace(/제\s*\d+\s*회\s*/, "");
    s = s.replace(/\s*(공모전|경진대회|해커톤|챌린지|대회|공모)\s*$/, "").trim();
    return s.length > 13 ? s.slice(0,13) + "…" : s;
  }

  function dayKey(dt){ return dt.getUTCFullYear()*10000 + (dt.getUTCMonth()+1)*100 + dt.getUTCDate(); }
  function calDate(mo, da){
    if(!(mo >= 1 && mo <= 12 && da >= 1 && da <= 31)) return null;
    var dt = new Date(Date.UTC(Y, mo-1, da));
    return dt.getUTCMonth() === mo-1 ? dt : null;   // 9/31 같은 값 걸러내기
  }

  var RANGE_RE = /(\d{1,2})\s*\/\s*(\d{1,2})\s*[~\-–]\s*(?:(\d{1,2})\s*\/\s*)?(\d{1,2})(?!\s*[\/:])/;
  var ONE_RE   = /(\d{1,2})\s*\/\s*(\d{1,2})/;

  function labelOf(s){
    return s.replace(/\d{1,2}\s*\/\s*\d{1,2}/g, " ")          // 남은 날짜
            .replace(/\d{1,2}\s*:\s*\d{2}/g, " ")             // 시각
            .replace(/[(（]\s*[월화수목금토일]\s*[)）]/g, " ")  // 요일
            .replace(/\s+/g, " ").replace(/^[~\-–,\s]+/, "").trim();
  }

  // 마감일(c.end)은 구조화된 값이라 늘 정확하고, 나머지는 c.sched 문장에서 날짜를 긁어온다.
  function eventsOf(c){
    var out = [], endKey = null;
    if(!c.rolling && c.end){
      endKey = dayKey(c.end);
      out.push({ d:c.end, k:"end", t:"접수 마감", c:c });
    }
    if(!c.sched) return out;

    c.sched.split("→").forEach(function(seg){
      var s, e = null, rest, m = seg.match(RANGE_RE);
      if(m){
        s = calDate(+m[1], +m[2]);
        e = calDate(+(m[3] || m[1]), +m[4]);
      } else {
        m = seg.match(ONE_RE);
        if(!m) return;
        s = calDate(+m[1], +m[2]);
      }
      if(!s) return;
      rest = seg.replace(m[0], " ");
      var t = labelOf(rest);
      if(!t) return;

      function put(dt){
        if(endKey !== null && dayKey(dt) === endKey) return;  // 마감일과 겹치면 구조화된 쪽을 남긴다
        out.push({ d:dt, k:"sched", t:t, c:c });
      }
      put(s);
      // 본선 1박2일처럼 짧은 구간은 하루씩 다 찍고, 47일 멘토링 같은 긴 구간은 시작만 찍는다
      if(e && e > s && (e - s) <= 6*86400000){
        for(var t2 = s.getTime() + 86400000; t2 <= e.getTime(); t2 += 86400000) put(new Date(t2));
      }
    });
    return out;
  }

  function finRow(c){
    var h = '<div class="fin">' + ddayHTML(c) +
            '<div><a href="#c-' + cid(c.name) + '" data-jump="' + esc(c.name) + '">' +
            esc(c.name) + '</a><span class="fin-org">' + esc(c.org) + '</span>' +
            dvChip(c.name) + '<div class="fin-meta">' + esc(c.prize) + '</div>';
    PEOPLE.forEach(function(p){
      var t = memoOf(c.name, p.id);
      if(!t) return;
      h += '<div class="memo-line peer"><span class="memo-tag" data-w="' + p.id + '">' +
           esc(p.name) + '</span><span class="memo-text">' + esc(t) + '</span></div>';
    });
    return h + '</div></div>';
  }

  function calHTML(evs, list, col){
    var byDay = {};
    evs.forEach(function(e){ (byDay[dayKey(e.d)] = byDay[dayKey(e.d)] || []).push(e); });

    // 이번 달부터 마지막 일정이 있는 달까지 (넉넉잡아 12개월로 자른다)
    var lo = KP.y*12 + (KP.m-1), hi = lo;
    evs.forEach(function(e){
      var n = e.d.getUTCFullYear()*12 + e.d.getUTCMonth();
      if(n < lo) lo = n;
      if(n > hi) hi = n;
    });
    if(hi - lo > 11) hi = lo + 11;

    // 한 달만 그린다. 넘겨 본 달은 기억해 두되, 범위 밖으로 나가면 끌어당긴다
    if(calMonth === null) calMonth = KP.y*12 + (KP.m-1);
    if(calMonth < lo) calMonth = lo;
    if(calMonth > hi) calMonth = hi;

    var y = Math.floor(calMonth/12), m = calMonth % 12;
    var lead = new Date(Date.UTC(y, m, 1)).getUTCDay();
    var len  = new Date(Date.UTC(y, m+1, 0)).getUTCDate();
    var mine = evs.filter(function(e){
      return e.d.getUTCFullYear()*12 + e.d.getUTCMonth() === calMonth;
    }).length;
    var todayKey = dayKey(TODAY);

    var h = '<div class="cal"><div class="cal-h"><h2>일정 달력</h2>' +
            '<span class="n">전체 ' + evs.length + '개 일정</span></div>' +
            '<div class="cal-nav">' +
            '<button type="button" class="cal-b" data-cal="-1" aria-label="이전 달"' +
            (calMonth <= lo ? " disabled" : "") + '>‹</button>' +
            '<span class="cal-t">' + y + '. ' + (m+1 < 10 ? "0" : "") + (m+1) + '</span>' +
            '<button type="button" class="cal-b" data-cal="1" aria-label="다음 달"' +
            (calMonth >= hi ? " disabled" : "") + '>›</button>' +
            '<span class="cal-i">이 달 ' + mine + '건 · ' + (calMonth-lo+1) + '/' + (hi-lo+1) + '</span>' +
            '</div>';

    h += '<div class="legend cal-leg">';
    list.forEach(function(c){
      h += '<span><i style="background:var(--e' + col[cid(c.name)] + ')"></i>' +
           esc(shortName(c.name)) + '</span>';
    });
    h += '</div>';

    h += '<div class="cal-m"><div class="cal-g">';
    WD.forEach(function(w){ h += '<div class="cal-w">' + w + '</div>'; });
    for(var b = 0; b < lead; b++) h += '<div class="cal-d off"></div>';

    for(var dd = 1; dd <= len; dd++){
      var k = y*10000 + (m+1)*100 + dd;
      h += '<div class="cal-d' + (k === todayKey ? " now" : "") + (k < todayKey ? " was" : "") +
           '"><span class="dn">' + dd + '</span>';
      (byDay[k] || []).forEach(function(e){
        h += '<button type="button" class="ev" data-k="' + e.k + '" data-ei="' + e.i + '"' +
             ' style="--c:var(--e' + col[cid(e.c.name)] + ')"' +
             ' title="' + esc(e.c.name + " — " + e.t) +
             '"><b>' + esc(shortName(e.c.name)) + '</b> ' + esc(e.t) + '</button>';
      });
      h += '</div>';
    }
    for(var tail = (lead + len) % 7; tail > 0 && tail < 7; tail++) h += '<div class="cal-d off"></div>';
    return h + '</div></div></div>';
  }

  /* 달력 칩을 누르면 그 일정이 뭔지 띄운다 */
  var sheetEl = document.getElementById("sheet");
  var calEvs = [], calCol = {};

  function openSheet(i){
    var e = calEvs[i];
    if(!e) return;
    var c = e.c, n = days(e.d);

    var meta = n < 0 ? "지난 일정" : (n === 0 ? "오늘" : "D-" + n);
    if(e.k === "end"){
      // 마감 시각이 공고에 나와 있을 때만 보여준다. d()가 hh 없이 만든 기본값(23:59)은
      // hasTime이 없어서 여기 안 걸리고, 실제로 확인된 23:59(hasTime=true)는 걸려서 나온다.
      if(c.end.hasTime){
        var hh = c.end.getUTCHours(), mm = c.end.getUTCMinutes();
        meta += " · " + hh + ":" + (mm < 10 ? "0" : "") + mm + " 마감";
      }
    }

    var h = '<div class="sheet-h">' +
            '<span class="sheet-d">' + md(e.d) + ' (' + WD[e.d.getUTCDay()] + ')</span>' +
            '<p class="sheet-t">' + esc(e.t) + '</p>' +
            '<button type="button" class="sheet-x" data-x="1" aria-label="닫기">✕</button></div>' +
            '<p class="sheet-meta">' + esc(meta) + '</p>' +
            '<p class="sheet-name"><i></i>' + esc(c.name) + '</p>';

    if(e.k !== "end") h += '<p class="sheet-auto">공고의 일정 문구에서 자동으로 읽어온 날짜입니다.</p>';

    h += '<div class="sheet-go">' +
         '<a class="go" href="' + esc(c.url) + '" target="_blank" rel="noopener">공고 열기 →</a>' +
         '<a class="go" href="#c-' + cid(c.name) + '" data-jump="' + esc(c.name) + '">공모전 자세히 →</a>' +
         '</div>';

    var box = sheetEl.querySelector(".sheet-c");
    box.style.setProperty("--c", "var(--e" + calCol[cid(c.name)] + ")");
    box.innerHTML = h;
    sheetEl.hidden = false;
  }
  function closeSheet(){ sheetEl.hidden = true; }

  function renderFinal(){
    var list = agreed();
    var badge = document.querySelector('#tabs [data-v="final"] .n');
    if(badge) badge.textContent = list.length;

    if(!list.length){
      finalEl.innerHTML = '<p class="empty">아직 두 사람이 함께 고른 공모전이 없습니다. ' +
        '「선택 후보」 탭에서 태영·지안이 같은 공모전을 고르면 여기로 모이고, 일정이 달력에 표시됩니다.</p>';
      return;
    }

    var evs = [];
    list.forEach(function(c){ evs = evs.concat(eventsOf(c)); });
    evs.sort(function(a,b){ return (a.d - b.d) || (a.k === "end" ? -1 : 1); });

    // 마감 빠른 순으로 색을 하나씩 배정한다 (6개를 넘기면 다시 처음 색으로 돈다)
    var col = {};
    list.forEach(function(c, i){ col[cid(c.name)] = (i % PAL) + 1; });
    evs.forEach(function(e, i){ e.i = i; });   // 칩에서 상세를 찾아갈 번호
    calEvs = evs; calCol = col;

    var h = '<p class="fin-note">태영·지안이 <b>둘 다 고른 ' + list.length + '건</b>입니다. ' +
            '아래 달력과 목록은 이 ' + list.length + '건의 일정만 모아 보여줍니다.</p>';
    list.forEach(function(c){ h += finRow(c); });
    finalEl.innerHTML = h + calHTML(evs, list, col) +
      '<p class="fin-note" style="margin-top:20px">달력에서 <b>꽉 찬 칩이 접수 마감</b>, 옅은 칩이 심사·행사 일정입니다. ' +
      '칩을 누르면 그 일정이 무엇인지 자세히 볼 수 있습니다.</p>';
  }

  function render(){ renderAll(); renderPicked(); renderFinal(); }

  /* ---------- 선택 팝오버 ---------- */
  function closePop(){
    var p = document.querySelector(".pop");
    if(p){
      var b = p.parentNode.querySelector(".pickbtn");
      if(b) b.setAttribute("aria-expanded","false");
      p.remove();
    }
  }
  document.addEventListener("click", function(e){
    var btn = e.target.closest("[data-pick]");
    var inPop = e.target.closest(".pop");
    if(!btn && !inPop){ closePop(); return; }

    if(btn){
      var wasOpen = btn.getAttribute("aria-expanded") === "true";
      closePop();
      if(wasOpen) return;
      var name = btn.getAttribute("data-pick");
      var pop = document.createElement("div");
      pop.className = "pop";
      pop.innerHTML = PEOPLE.map(function(p){
        var on = picked(name, p.id);
        return '<button type="button" data-p="' + p.id + '" data-n="' + esc(name) +
               '" aria-pressed="' + (on?"true":"false") + '"><span class="box">' +
               (on?"✓":"") + '</span>' + p.name + '</button>';
      }).join("") + (function(){
        var on = skipped(name);
        return '<button type="button" data-p="skip" data-n="' + esc(name) +
               '" aria-pressed="' + (on?"true":"false") + '"><span class="box">' +
               (on?"✕":"") + '</span>취소</button>';
      })();
      btn.parentNode.appendChild(pop);
      btn.setAttribute("aria-expanded","true");
      return;
    }

    var pb = e.target.closest(".pop button");
    if(pb){ toggle(pb.getAttribute("data-n"), pb.getAttribute("data-p")); closePop(); }
  });
  document.addEventListener("keydown", function(e){ if(e.key === "Escape"){ closePop(); closeSheet(); } });

  /* ---------- 직접 추가 ---------- */
  var addSheet = document.getElementById("addsheet"), addForm = document.getElementById("addf");
  var addWho = null, MEKEY = "hgu.board.me";
  document.getElementById("add-g").innerHTML = GROUPS.map(function(g){
    return '<option value="' + g.id + '">' + esc(g.label) + '</option>';
  }).join("");
  function setWho(p){
    addWho = p;
    Array.prototype.forEach.call(document.querySelectorAll("#add-who button"), function(b){
      b.setAttribute("aria-pressed", b.getAttribute("data-p") === p ? "true" : "false");
    });
  }
  function openAdd(){
    closePop(); closeSheet();
    addForm.reset(); document.getElementById("add-err").textContent = "";
    var me = null; try{ me = localStorage.getItem(MEKEY); }catch(e){}
    setWho(me === "tae" || me === "jian" ? me : null);
    addSheet.hidden = false;
    document.getElementById("add-name").focus();
  }
  function closeAdd(){ addSheet.hidden = true; }

  document.addEventListener("click", function(e){
    if(e.target.closest("#addopen")){ openAdd(); return; }
    if(e.target.closest("[data-addx]")){ closeAdd(); return; }
    var wb = e.target.closest("#add-who button");
    if(wb){ setWho(wb.getAttribute("data-p")); return; }
    var del = e.target.closest("[data-del]");
    if(del){
      var k = del.getAttribute("data-del"), o = DATA.custom[k];
      if(!o) return;
      if(!confirm("「" + o.name + "」을(를) 지울까요? 선택·메모는 그대로 남습니다.")) return;
      delete DATA.custom[k];
      push("/custom/" + k, null);
      render();
    }
  });
  document.addEventListener("keydown", function(e){ if(e.key === "Escape") closeAdd(); });

  addForm.addEventListener("submit", function(e){
    e.preventDefault();
    var err = document.getElementById("add-err");
    var name = document.getElementById("add-name").value.trim().replace(/\s+/g," ");
    var url  = document.getElementById("add-url").value.trim();
    var end  = document.getElementById("add-end").value;
    var time = document.getElementById("add-time").value;
    var memo = document.getElementById("add-memo").value.trim();
    var g    = document.getElementById("add-g").value;
    if(!addWho){ err.textContent = "누가 추가하는지 골라 주세요."; return; }
    if(!name){ err.textContent = "공모전 이름을 적어 주세요."; return; }
    if(!/^https?:\/\/\S+\.\S+/.test(url)){ err.textContent = "공고 링크를 https://로 시작하는 주소로 넣어 주세요."; return; }
    if(!/^\d{4}-\d{2}-\d{2}$/.test(end)){ err.textContent = "접수 마감일을 골라 주세요."; return; }
    if(!cid(name)){ err.textContent = "이름에 글자가 하나는 있어야 합니다."; return; }
    var dup = allC().filter(function(c){ return cid(c.name) === cid(name); })[0];
    if(dup){ err.textContent = "같은 이름이 이미 보드에 있습니다" + (dup.pending ? " (정리 대기 중)." : "."); return; }
    try{ localStorage.setItem(MEKEY, addWho); }catch(ex){}
    var key = "x" + Date.now().toString(36) + Math.random().toString(36).slice(2,5);
    var o = { g:g, name:name, url:url, end:end, by:addWho, at:Date.now() };
    if(time) o.time = time;
    if(memo) o.memo = memo;
    DATA.custom[key] = o;
    push("/custom/" + key, o);
    closeAdd();
    showView(isClosed(customList().filter(function(c){ return c.key === key; })[0] || {end:new Date()}) ? "closed" : "all");
    render();
    var el = document.getElementById("c-" + cid(name));
    if(el){
      el.classList.add("flash");
      setTimeout(function(){ el.classList.remove("flash"); }, 1800);
      el.scrollIntoView({ behavior: "auto", block: "center" });
    }
  });

  /* ---------- 탭 ---------- */
  var VIEWS = [{id:"all", label:"공모전"}, {id:"pick", label:"선택 후보"}, {id:"final", label:"최종 선택"}, {id:"closed", label:"마감"}];
  var tabs = document.getElementById("tabs");
  tabs.innerHTML = VIEWS.map(function(v,i){
    return '<button type="button" role="tab" data-v="' + v.id + '" aria-selected="' + (i===0) + '">' +
           v.label + '<span class="n"></span></button>';
  }).join("");
  function showView(v){
    closePop(); closeSheet(); closeAdd();
    Array.prototype.forEach.call(tabs.querySelectorAll("button"), function(x){
      x.setAttribute("aria-selected", x.getAttribute("data-v") === v ? "true" : "false");
    });
    VIEWS.forEach(function(x){ document.getElementById("v-" + x.id).hidden = (x.id !== v); });
    document.getElementById("past").hidden = (v !== "closed");
    if(v === "pick") autoGrowAll();   // 숨김 상태에서 못 잰 높이를 지금 다시 잡는다
  }
  tabs.addEventListener("click", function(e){
    var b = e.target.closest("button[data-v]");
    if(!b) return;
    showView(b.getAttribute("data-v"));
  });

  /* ---------- 달력 달 넘기기 ---------- */
  function calStep(dir){
    var b = finalEl.querySelector('[data-cal="' + dir + '"]');
    if(!b || b.disabled) return;      // 범위 끝에서는 움직이지 않는다
    calMonth += dir;
    renderFinal();
  }
  document.addEventListener("click", function(e){
    var b = e.target.closest("[data-cal]");
    if(b && !b.disabled){ calStep(+b.getAttribute("data-cal")); return; }

    if(e.target.closest("[data-x]")){ closeSheet(); return; }   // 닫기 버튼 · 바깥 어둠
    var ev = e.target.closest(".ev");
    if(ev) openSheet(+ev.getAttribute("data-ei"));
  });

  // 손가락으로 옆으로 밀어서 넘기기. 세로 스크롤과 헷갈리지 않게 가로 이동이 더 클 때만 먹는다
  var swX = null, swY = null;
  document.addEventListener("touchstart", function(e){
    var t = e.changedTouches[0];
    swX = e.target.closest(".cal") ? t.clientX : null;
    swY = t.clientY;
  }, {passive:true});
  document.addEventListener("touchend", function(e){
    if(swX === null) return;
    var dx = e.changedTouches[0].clientX - swX, dy = e.changedTouches[0].clientY - swY;
    swX = null;
    if(Math.abs(dx) >= 50 && Math.abs(dx) > Math.abs(dy)) calStep(dx < 0 ? 1 : -1);
  }, {passive:true});

  /* 선택 후보에서 공모전 이름을 누르면 공모전 탭의 해당 항목으로 이동 */
  document.addEventListener("click", function(e){
    var j = e.target.closest("[data-jump]");
    if(!j) return;
    e.preventDefault();
    var jn = j.getAttribute("data-jump");
    var jc = allC().filter(function(c){ return c.name === jn; })[0];
    showView(jc && isClosed(jc) ? "closed" : "all");   // 마감된 건은 마감 탭에 있다
    var el = document.getElementById("c-" + cid(jn));
    if(!el) return;

    el.classList.remove("flash");
    void el.offsetWidth;                 // 연속 클릭 시 애니메이션 다시 태우기
    el.classList.add("flash");
    setTimeout(function(){ el.classList.remove("flash"); }, 1800);

    // 즉시 이동. smooth는 탭을 펼치며 레이아웃이 바뀌는 프레임에 걸면 취소되고,
    // requestAnimationFrame으로 미루면 탭이 백그라운드일 때 콜백이 안 돌아 아예 안 움직인다.
    // 동기 호출이 가장 확실하고, 어디로 왔는지는 위의 flash 하이라이트가 알려준다.
    el.scrollIntoView({ behavior: "auto", block: "center" });
  });

  /* ---------- 자정(KST) 갱신 ---------- */
  function refreshDate(){
    var p = kstParts();
    if(p.y===KP.y && p.m===KP.m && p.d===KP.d) return;
    KP = p; TODAY = new Date(Date.UTC(p.y, p.m-1, p.d));
    stamp(); render();
  }
  function stamp(){
    document.getElementById("today").textContent =
      KP.y + "." + (KP.m<10?"0":"") + KP.m + "." + (KP.d<10?"0":"") + KP.d;
  }
  setInterval(refreshDate, 60000);
  document.addEventListener("visibilitychange", function(){ if(!document.hidden) refreshDate(); });
  window.addEventListener("focus", refreshDate);

  /* ---------- 지난 대회 ---------- */
  var pb2 = document.getElementById("past-body");
  PAST.forEach(function(r){
    var tr = document.createElement("tr");
    tr.innerHTML = '<td>'+esc(r[0])+'</td><td>'+esc(r[1])+'</td><td class="w">'+esc(r[2])+'</td><td>'+esc(r[3])+'</td>';
    pb2.appendChild(tr);
  });

  /* ---------- 시작 ---------- */
  loadLocal(); stamp(); render(); connect();
})();
</script>
